  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.js";
    const files = {
 "app.py": "\"\"\"Triper session UI.\n\nThe page is a thin shell over the local pipeline. Trip inputs live in\nst.session_state and are discarded by \"Clear all my data\". Nothing is written\nto a database. Labels follow the session language; scores do not.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nfrom dataclasses import replace\nfrom datetime import date, datetime\n\nimport streamlit as st\n\nfrom triper.deidentify import PayloadRejected, build_llm_payload, share_links\nfrom triper.explain import render_explanation\nfrom triper.i18n import DEFAULT_LANG, floor_text, t, venue_caption\nfrom triper.links import resolve_links\nfrom triper.llm import LLMClient\nfrom triper.money import CURRENCIES, exchange_suggestion, format_money, format_rate\nfrom triper.models import (\n    FEATURES,\n    INTERESTS,\n    LinkImport,\n    Member,\n    MustVisit,\n    TripInput,\n    blank_preferences,\n    format_hm,\n)\nfrom triper.pipeline import (\n    apply_member_feedback,\n    default_alphas,\n    illustrative_forecast,\n    plan_trip,\n    rephrase_explanations,\n)\nfrom triper.preferences import rating_to_signal\nfrom triper.sample import sample_trip\nfrom triper.scoring import preference_match\nfrom triper.venues import ABODES, load_venues\n\nst.set_page_config(page_title=\"Triper\", page_icon=\"TR\", layout=\"wide\")\nst.markdown(\n    \"\"\"\n    <style>\n    .stApp { background: #f6f3ec; }\n    html, body, [class*=\"css\"] {\n        font-family: \"Segoe UI\", \"PingFang SC\", \"Noto Sans SC\", \"Microsoft YaHei\", sans-serif;\n    }\n    h1, h2, h3 {\n        font-family: Georgia, \"Songti SC\", \"STSong\", \"Noto Serif SC\", serif;\n        letter-spacing: -0.02em;\n    }\n    div[data-testid=\"stSidebar\"] { background: #e7efe9; }\n    .triper-banner {\n        background: #123c3a;\n        color: #f6f3ec;\n        padding: 0.9rem 1.1rem;\n        border-radius: 12px;\n        margin-bottom: 0.8rem;\n    }\n    .triper-banner p { margin: 0.2rem 0 0; color: #d5e4df; }\n    <\/style>\n    \"\"\",\n    unsafe_allow_html=True,\n)\n\nVENUES = load_venues()\nVENUE_BY_ID = {venue.id: venue for venue in VENUES}\n_HARD = (\"diet\", \"accessibility\", \"hours\", \"budget\", \"weather\")\n_WX = {\n    \"Partly cloudy\": \"wx.partly_cloudy\",\n    \"Showers possible\": \"wx.showers\",\n    \"Warm\": \"wx.warm\",\n    \"moderate\": \"risk.moderate\",\n    \"higher\": \"risk.higher\",\n    \"low\": \"risk.low\",\n}\n\n\ndef lang() -> str:\n    return st.session_state.get(\"lang\", DEFAULT_LANG)\n\n\ndef tr(key: str, **kwargs: object) -> str:\n    return t(key, lang(), **kwargs)\n\n\ndef _named(venue_id: str) -> str:\n    venue = VENUE_BY_ID.get(venue_id)\n    if venue is None:\n        return venue_id\n    return venue_caption(venue.name, venue.aliases, lang())\n\n\ndef _init() -> None:\n    ss = st.session_state\n    if ss.get(\"ready\"):\n        return\n    kept_lang = ss.get(\"lang\", DEFAULT_LANG)\n    ss.ready = True\n    ss.lang = kept_lang if kept_lang in (\"zh\", \"en\") else DEFAULT_LANG\n    ss.members = []\n    ss.musts = []\n    ss.links = []\n    ss.excluded = []\n    ss.plan = None\n    ss.link_result = None\n    ss.confirmed = False\n    ss.notice = False\n    ss.ai_consent = False\n    ss.personal_consent = False\n    ss.weather = \"forecast\"\n    ss.delay_minutes = 0\n    ss.alphas = default_alphas()\n    ss.beta = 0.5\n    ss.start_date = date(2026, 11, 14)\n    ss.end_date = date(2026, 11, 15)\n    ss.day_start = \"09:30\"\n    ss.day_end = \"21:00\"\n    ss.budget = 420.0\n    ss.budget_currency = \"SGD\"\n    ss.modes = [\"transit\", \"walk\"]\n    ss.abode_label = \"Marina Bay area\"\n    ss.abode_address = \"\"\n    ss.feedback = []\n    ss.model_note = \"\"\n    ss._seq = 20\n\n\ndef _abode(label: str) -> dict:\n    for item in ABODES:\n        if item[\"label\"] == label:\n            return item\n    return ABODES[0]\n\n\ndef _sync_member_controls(member: Member) -> None:\n    for interest in INTERESTS:\n        st.session_state.setdefault(f\"pref_{member.id}_{interest}\", float(member.preferences.get(interest, 0.0)))\n    st.session_state.setdefault(f\"weight_{member.id}\", float(member.weight))\n    st.session_state.setdefault(f\"pace_{member.id}\", member.pace)\n    st.session_state.setdefault(f\"crowd_{member.id}\", float(member.crowd_tolerance))\n    st.session_state.setdefault(f\"diet_{member.id}\", list(member.diets))\n    st.session_state.setdefault(f\"access_{member.id}\", list(member.accessibility))\n\n\ndef _load_sample() -> None:\n    trip = sample_trip()\n    ss = st.session_state\n    ss.members = trip.members\n    ss.musts = list(trip.must_visits)\n    ss.links = list(trip.links)\n    ss.excluded = []\n    ss.plan = None\n    ss.link_result = None\n    ss.confirmed = False\n    ss.weather = \"forecast\"\n    ss.delay_minutes = 0\n    ss.alphas = dict(trip.alphas)\n    ss.beta = trip.beta\n    ss.start_date = date.fromisoformat(trip.start_date)\n    ss.end_date = date.fromisoformat(trip.end_date)\n    ss[\"start_date_input\"] = ss.start_date\n    ss[\"end_date_input\"] = ss.end_date\n    ss.day_start = trip.day_start\n    ss.day_end = trip.day_end\n    ss.budget = trip.budget_sgd\n    ss.budget_currency = trip.budget_currency or \"SGD\"\n    ss[\"budget_currency\"] = ss.budget_currency\n    ss.modes = list(trip.transport_modes)\n    ss[\"modes_input\"] = list(trip.transport_modes)\n    ss.abode_label = trip.abode_label\n    ss[\"abode_label_input\"] = trip.abode_label\n    ss.abode_address = trip.abode_address\n    ss[\"weather_input\"] = \"forecast\"\n    ss[\"delay_input\"] = 0\n    ss.feedback = []\n    ss.model_note = \"note.sample\"\n    for feature, value in trip.alphas.items():\n        ss[f\"alpha_{feature}\"] = value\n    ss[\"beta_slider\"] = trip.beta\n    ss[\"budget_input\"] = trip.budget_sgd\n    ss[\"day_start_input\"] = trip.day_start\n    ss[\"day_end_input\"] = trip.day_end\n    ss[\"abode_address_input\"] = trip.abode_address\n    for member in trip.members:\n        for interest in INTERESTS:\n            ss[f\"pref_{member.id}_{interest}\"] = float(member.preferences.get(interest, 0.0))\n        ss[f\"weight_{member.id}\"] = float(member.weight)\n        ss[f\"pace_{member.id}\"] = member.pace\n        ss[f\"crowd_{member.id}\"] = float(member.crowd_tolerance)\n        ss[f\"diet_{member.id}\"] = list(member.diets)\n        ss[f\"access_{member.id}\"] = list(member.accessibility)\n\n\ndef _clear() -> None:\n    kept = st.session_state.get(\"lang\", DEFAULT_LANG)\n    for key in list(st.session_state.keys()):\n        del st.session_state[key]\n    st.session_state.lang = kept\n\n\ndef _members_from_state() -> list[Member]:\n    updated: list[Member] = []\n    for member in st.session_state.members:\n        _sync_member_controls(member)\n        preferences = {interest: float(st.session_state[f\"pref_{member.id}_{interest}\"]) for interest in INTERESTS}\n        updated.append(\n            replace(\n                member,\n                preferences=preferences,\n                weight=float(st.session_state[f\"weight_{member.id}\"]),\n                pace=st.session_state[f\"pace_{member.id}\"],\n                crowd_tolerance=float(st.session_state[f\"crowd_{member.id}\"]),\n                diets=list(st.session_state[f\"diet_{member.id}\"]),\n                accessibility=list(st.session_state[f\"access_{member.id}\"]),\n            )\n        )\n    return updated\n\n\ndef _alphas_from_state() -> dict[str, float]:\n    alphas = dict(st.session_state.alphas)\n    for feature in FEATURES:\n        key = f\"alpha_{feature}\"\n        if key in st.session_state:\n            alphas[feature] = float(st.session_state[key])\n    return alphas\n\n\ndef _fx_suggestion():\n    amount = float(st.session_state.get(\"budget_input\", st.session_state.budget) or 0.0)\n    currency = st.session_state.get(\"budget_currency\", \"SGD\")\n    cache = st.session_state.setdefault(\"fx_cache\", {})\n    return exchange_suggestion(amount, currency, allow_network=True, cache=cache)\n\n\ndef _render_exchange() -> None:\n    suggestion = _fx_suggestion()\n    st.markdown(f\"**{tr('fx.title')}**\")\n    st.write(\n        tr(\n            \"fx.line\",\n            entered=format_money(suggestion.entered_amount, suggestion.entered_currency),\n            converted=format_money(suggestion.converted_amount, suggestion.converted_currency),\n        )\n    )\n    if suggestion.entered_currency == \"SGD\":\n        st.caption(tr(\"fx.already_sgd\"))\n    else:\n        st.caption(tr(\"fx.used_for_planning\", planning=format_money(suggestion.planning_sgd, \"SGD\")))\n    st.caption(\n        tr(\n            \"fx.rate\",\n            base=suggestion.rate_base,\n            rate=format_rate(suggestion.rate_value),\n            quote=suggestion.rate_quote,\n            source=tr(f\"fx.{suggestion.source}\"),\n            as_of=suggestion.as_of,\n        )\n    )\n    st.caption(tr(\"fx.disclaimer\"))\n\n\ndef _current_trip() -> TripInput:\n    label = st.session_state.get(\"abode_label_input\", st.session_state.abode_label)\n    preset = _abode(label)\n    address = st.session_state.get(\"abode_address_input\", st.session_state.abode_address)\n    start = st.session_state.get(\"start_date_input\", st.session_state.start_date)\n    end = st.session_state.get(\"end_date_input\", st.session_state.end_date)\n    if isinstance(start, datetime):\n        start = start.date()\n    if isinstance(end, datetime):\n        end = end.date()\n    delay = int(st.session_state.get(\"delay_input\", st.session_state.delay_minutes))\n    return TripInput(\n        start_date=start.isoformat(),\n        end_date=end.isoformat(),\n        day_start=st.session_state.get(\"day_start_input\", st.session_state.day_start).strip(),\n        day_end=st.session_state.get(\"day_end_input\", st.session_state.day_end).strip(),\n        budget_sgd=float(st.session_state.get(\"budget_input\", st.session_state.budget)),\n        budget_currency=st.session_state.get(\"budget_currency\", \"SGD\"),\n        fx_sgd_per_unit=_fx_suggestion().sgd_per_unit,\n        transport_modes=list(st.session_state.get(\"modes_input\", st.session_state.modes)),\n        abode_label=label,\n        abode_address=address.strip(),\n        abode_lat=float(preset[\"lat\"]),\n        abode_lon=float(preset[\"lon\"]),\n        members=_members_from_state(),\n        must_visits=list(st.session_state.musts),\n        links=list(st.session_state.links),\n        alphas=_alphas_from_state(),\n        beta=float(st.session_state.get(\"beta_slider\", st.session_state.beta)),\n        weather_scenario=st.session_state.get(\"weather_input\", st.session_state.weather),\n        delay_minutes=delay,\n        delay_date=start.isoformat() if delay else None,\n        excluded_venue_ids=list(st.session_state.excluded),\n    )\n\n\ndef _validate(trip: TripInput) -> list[str]:\n    errors = []\n    if not trip.members:\n        errors.append(tr(\"error.members\"))\n    if trip.end_date < trip.start_date:\n        errors.append(tr(\"error.dates\"))\n    try:\n        if trip.day_end <= trip.day_start:\n            errors.append(tr(\"error.times\"))\n    except ValueError:\n        errors.append(tr(\"error.time_format\"))\n    if trip.budget_sgd <= 0:\n        errors.append(tr(\"error.budget\"))\n    if not trip.transport_modes:\n        errors.append(tr(\"error.modes\"))\n    if len(trip.dates()) > 4:\n        errors.append(tr(\"error.span\"))\n    return errors\n\n\ndef _ai_allowed() -> bool:\n    return bool(st.session_state.notice and st.session_state.ai_consent)\n\n\ndef _show_note(note: str) -> None:\n    if not note:\n        return\n    st.info(tr(note) if note.startswith(\"note.\") or note.startswith(\"model.\") or note.startswith(\"link.\") else note)\n\n\ndef _constraint_lines(plan, members: list[Member]) -> list[str]:\n    lines = []\n    for dropped in plan.filtered.dropped:\n        reason = next((item for item in dropped.reasons if item in _HARD), None)\n        venue = VENUE_BY_ID.get(dropped.venue_id)\n        if reason is None or venue is None or not members:\n            continue\n        mean = sum(preference_match(member, venue) for member in members) / len(members)\n        if mean < 0.30:\n            continue\n        lines.append(\n            tr(\n                \"block.line\",\n                name=venue_caption(venue.name, venue.aliases, lang()),\n                reason=tr(f\"reason.{reason}\"),\n            )\n        )\n    return lines\n\n\ndef _conflict_lines(plan, trip: TripInput) -> list[str]:\n    scheduled = {stop.venue_id for day in plan.route.days for stop in day.stops}\n    lines = []\n    seen: set[str] = set()\n    for must in trip.must_visits:\n        if must.venue_id in scheduled or must.venue_id in seen:\n            continue\n        seen.add(must.venue_id)\n        kind = tr(f\"kind.{must.kind.upper()}\")\n        name = _named(must.venue_id)\n        dropped = next((item for item in plan.filtered.dropped if item.venue_id == must.venue_id), None)\n        if dropped and dropped.reasons:\n            reason = tr(f\"reason.{dropped.reasons[0]}\")\n            lines.append(tr(\"conflict.blocked\", name=name, kind=kind, reason=reason))\n            continue\n        bits = \" \".join(part for part in (must.on_date, must.at_time) if part)\n        when = tr(\"conflict.when\", when=bits) if bits else \"\"\n        lines.append(tr(\"conflict.slot\", name=name, kind=kind, when=when))\n    if plan.route.conflicts and not any(day.stops for day in plan.route.days):\n        lines.append(tr(\"conflict.infeasible\"))\n    return lines\n\n\ndef _render_banner() -> None:\n    st.markdown(\n        f\"\"\"\n        <div class=\"triper-banner\">\n          <strong>Triper<\/strong>\n          <p>{tr(\"banner.body\")}<\/p>\n        <\/div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n\ndef _render_members() -> None:\n    st.subheader(tr(\"members.title\"))\n    st.caption(tr(\"members.help\"))\n    if not st.session_state.members:\n        st.info(tr(\"members.empty\"))\n    for index, member in enumerate(list(st.session_state.members)):\n        _sync_member_controls(member)\n        with st.expander(f\"{member.name or tr('members.name')}  ·  {member.id}\", expanded=index == 0):\n            columns = st.columns([2, 1, 1])\n            columns[0].write(tr(\"members.email\", value=member.email or tr(\"members.none\")))\n            columns[1].write(tr(\"members.booking\", value=member.booking_ref or tr(\"members.none\")))\n            if columns[2].button(tr(\"members.remove\"), key=f\"remove_{member.id}\"):\n                st.session_state.members = [item for item in st.session_state.members if item.id != member.id]\n                st.rerun()\n            pref_cols = st.columns(4)\n            for offset, interest in enumerate(INTERESTS):\n                pref_cols[offset % 4].slider(tr(f\"interest.{interest}\"), 0.0, 1.0, key=f\"pref_{member.id}_{interest}\")\n            meta = st.columns(4)\n            meta[0].selectbox(\n                tr(\"members.pace\"),\n                [\"slow\", \"moderate\", \"fast\"],\n                format_func=lambda value: tr(f\"pace.{value}\"),\n                key=f\"pace_{member.id}\",\n            )\n            meta[1].slider(tr(\"members.crowd\"), 0.0, 1.0, key=f\"crowd_{member.id}\", help=tr(\"members.crowd_help\"))\n            meta[2].number_input(tr(\"members.weight\"), min_value=0.1, max_value=5.0, step=0.1, key=f\"weight_{member.id}\")\n            meta[3].caption(tr(\"members.weight_help\"))\n            st.multiselect(\n                tr(\"members.diet\"),\n                [\"halal\", \"vegetarian\", \"vegan\", \"no_pork\", \"alcohol_free\"],\n                format_func=lambda value: tr(f\"diet.{value}\"),\n                key=f\"diet_{member.id}\",\n            )\n            st.multiselect(\n                tr(\"members.access\"),\n                [\"wheelchair\", \"step_free\"],\n                format_func=lambda value: tr(f\"access.{value}\"),\n                key=f\"access_{member.id}\",\n            )\n    with st.expander(tr(\"members.add\")):\n        with st.form(\"add_member\"):\n            name = st.text_input(tr(\"members.name\"))\n            email = st.text_input(tr(\"members.email_field\"))\n            booking = st.text_input(tr(\"members.booking_field\"))\n            pace = st.selectbox(\n                tr(\"members.pace\"),\n                [\"moderate\", \"slow\", \"fast\"],\n                format_func=lambda value: tr(f\"pace.{value}\"),\n            )\n            submitted = st.form_submit_button(tr(\"members.add_button\"))\n        if submitted:\n            if not name.strip():\n                st.error(tr(\"members.name_required\"))\n            else:\n                st.session_state._seq += 1\n                member = Member(\n                    id=f\"m{st.session_state._seq}\",\n                    name=name.strip(),\n                    email=email.strip(),\n                    booking_ref=booking.strip(),\n                    preferences=blank_preferences(),\n                    pace=pace,\n                )\n                st.session_state.members.append(member)\n                _sync_member_controls(member)\n                st.rerun()\n\n\ndef _render_places() -> None:\n    st.subheader(tr(\"places.title\"))\n    left, right = st.columns(2)\n    with left:\n        venue_id = st.selectbox(\n            tr(\"places.place\"),\n            [venue.id for venue in VENUES],\n            format_func=_named,\n        )\n        kind = st.selectbox(\n            tr(\"places.kind\"),\n            [\"FLEXIBLE\", \"FIXED\"],\n            format_func=lambda value: tr(f\"kind.{value}\"),\n        )\n        on_date = st.text_input(tr(\"places.date\"), value=\"\")\n        at_time = st.text_input(tr(\"places.time\"), value=\"\")\n        if st.button(tr(\"places.add_must\")):\n            if kind == \"FIXED\" and at_time and not on_date:\n                st.error(tr(\"places.need_date\"))\n            else:\n                st.session_state.musts.append(\n                    MustVisit(\n                        venue_id=venue_id,\n                        kind=kind,\n                        on_date=on_date.strip() or None,\n                        at_time=at_time.strip() or None,\n                    )\n                )\n                st.rerun()\n        if st.session_state.musts:\n            for index, must in enumerate(list(st.session_state.musts)):\n                label = f\"{_named(must.venue_id)} · {tr(f'kind.{must.kind.upper()}')}\"\n                if must.on_date:\n                    label += f\" · {must.on_date}\"\n                if must.at_time:\n                    label += f\" {must.at_time}\"\n                cols = st.columns([4, 1])\n                cols[0].write(label)\n                if cols[1].button(tr(\"places.drop\"), key=f\"drop_must_{index}\"):\n                    st.session_state.musts.pop(index)\n                    st.rerun()\n        else:\n            st.caption(tr(\"places.none\"))\n    with right:\n        pasted = st.text_area(tr(\"places.paste\"), height=110, help=tr(\"places.paste_help\"))\n        extra = st.text_area(tr(\"places.caption\"), height=68)\n        if st.button(tr(\"places.save\")):\n            blob = \"\\n\".join(part.strip() for part in (pasted, extra) if part and part.strip())\n            pairs = share_links(blob)\n            if pairs:\n                for url, caption in pairs:\n                    st.session_state.links.append(LinkImport(url, caption))\n                st.rerun()\n            elif blob:\n                st.session_state.links.append(LinkImport(blob, \"\"))\n                st.rerun()\n        for index, link in enumerate(st.session_state.links):\n            st.write(f\"{index + 1}. {link.url or link.caption}\")\n            if link.caption and link.url:\n                st.caption(link.caption)\n        if st.button(tr(\"places.match\")):\n            trip = _current_trip()\n            consent = _ai_allowed()\n            if st.session_state.ai_consent and not st.session_state.notice:\n                st.warning(tr(\"places.notice_first\"))\n            st.session_state.link_result = resolve_links(trip, VENUES, llm=LLMClient(), ai_consent=consent)\n        result = st.session_state.link_result\n        if result is not None:\n            for key in result.note_keys:\n                st.caption(tr(key))\n            if not result.matches and not result.unmatched and not result.model_dropped:\n                st.info(tr(\"places.empty_match\"))\n            chosen = []\n            for match in result.matches:\n                confidence = f\"{match.confidence:.2f}\"\n                flag = tr(\"places.confirm\") if match.needs_confirmation else tr(\"places.high\")\n                match_key = f\"match_{match.venue_id}_{match.source}\"\n                st.session_state.setdefault(match_key, not match.needs_confirmation)\n                label = f\"{_named(match.venue_id)} ({confidence}, {match.source}, {flag})\"\n                if st.checkbox(label, key=match_key):\n                    chosen.append(match.venue_id)\n            for text in result.unmatched:\n                if text.startswith(\"Model suggested\"):\n                    continue\n                st.warning(tr(\"places.dropped\", text=text))\n            for name in result.model_dropped:\n                st.warning(tr(\"places.model_dropped\", name=name))\n            if st.button(tr(\"places.add_matches\")) and chosen:\n                existing = {must.venue_id for must in st.session_state.musts}\n                for venue_id in chosen:\n                    if venue_id not in existing:\n                        st.session_state.musts.append(MustVisit(venue_id, \"FLEXIBLE\"))\n                st.rerun()\n\n\ndef _render_inputs() -> None:\n    st.header(tr(\"tab.input\"))\n    st.caption(tr(\"input.caption\"))\n    top = st.columns(4)\n    top[0].date_input(tr(\"input.start\"), key=\"start_date_input\")\n    top[1].date_input(tr(\"input.end\"), key=\"end_date_input\")\n    top[2].text_input(tr(\"input.day_start\"), key=\"day_start_input\")\n    top[3].text_input(tr(\"input.day_end\"), key=\"day_end_input\")\n    second = st.columns([1.3, 0.8, 1.3, 1.4])\n    second[0].number_input(tr(\"input.budget\"), min_value=0.0, step=10.0, key=\"budget_input\")\n    second[1].selectbox(tr(\"input.currency\"), list(CURRENCIES), key=\"budget_currency\")\n    second[2].multiselect(\n        tr(\"input.modes\"),\n        [\"walk\", \"transit\", \"ride_hail\"],\n        format_func=lambda value: tr(f\"mode.{value}\"),\n        key=\"modes_input\",\n    )\n    second[3].selectbox(\n        tr(\"input.abode\"),\n        [item[\"label\"] for item in ABODES],\n        format_func=lambda value: tr(f\"area.{value}\"),\n        key=\"abode_label_input\",\n    )\n    st.text_input(tr(\"input.address\"), key=\"abode_address_input\", help=tr(\"input.address_help\"))\n    _render_exchange()\n    _render_members()\n    _render_places()\n\n\ndef _render_privacy() -> None:\n    st.header(tr(\"privacy.title\"))\n    st.markdown(tr(\"privacy.notice\"))\n    st.checkbox(tr(\"privacy.read\"), key=\"notice\")\n    st.checkbox(tr(\"privacy.ai\"), key=\"ai_consent\")\n    st.checkbox(tr(\"privacy.personal\"), key=\"personal_consent\")\n    key_on = bool(os.environ.get(\"LLM_API_KEY\") or os.environ.get(\"OPENAI_API_KEY\"))\n    st.caption(tr(\"privacy.key_on\") if key_on else tr(\"privacy.key_off\"))\n    st.subheader(tr(\"privacy.payload\"))\n    if not _members_from_state():\n        st.info(tr(\"privacy.need_member\"))\n        return\n    try:\n        payload = build_llm_payload(_current_trip(), purpose=\"extract_places\")\n    except PayloadRejected:\n        st.error(tr(\"privacy.refused\"))\n        return\n    except ValueError:\n        st.error(tr(\"error.generic\"))\n        return\n    st.json(payload)\n    st.caption(tr(\"privacy.preview_note\"))\n    st.caption(tr(\"fx.payload\"))\n\n\ndef _render_filter(plan) -> None:\n    kept_col, dropped_col = st.columns(2)\n    with kept_col:\n        st.markdown(f\"**{tr('opt.kept')}**\")\n        for item in plan.filtered.kept:\n            flags = \", \".join(tr(f\"flag.{flag}\") for flag in item.flags)\n            if item.venue.price_per_person_sgd is None:\n                price = tr(\"opt.price_unknown\")\n            else:\n                price = tr(\"opt.price\", amount=item.venue.price_per_person_sgd)\n            crowd = tr(\"opt.crowd\", value=item.venue.crowd_estimate)\n            st.write(f\"{_named(item.venue.id)} · {item.venue.area} · {price} · {crowd}\")\n            st.caption(tr(\"opt.source\", flags=flags, source=tr(\"catalogue.source\"), updated=item.venue.last_updated))\n    with dropped_col:\n        st.markdown(f\"**{tr('opt.dropped')}**\")\n        if not plan.filtered.dropped:\n            st.caption(tr(\"opt.none_dropped\"))\n        for item in plan.filtered.dropped:\n            st.write(_named(item.venue_id))\n            st.caption(\"; \".join(tr(f\"reason.{reason}\") for reason in item.reasons))\n\n\ndef _optimise() -> None:\n    trip = _current_trip()\n    errors = _validate(trip)\n    if errors:\n        for error in errors:\n            st.error(error)\n        return\n    try:\n        st.session_state.plan = plan_trip(trip, VENUES)\n    except ValueError:\n        st.error(tr(\"error.generic\"))\n        return\n    st.session_state.confirmed = False\n\n\ndef _render_optimise() -> None:\n    st.header(tr(\"opt.title\"))\n    st.caption(tr(\"opt.help\"))\n    cols = st.columns(4)\n    for index, feature in enumerate(FEATURES):\n        st.session_state.setdefault(f\"alpha_{feature}\", float(st.session_state.alphas.get(feature, 0.25)))\n        cols[index].slider(tr(f\"feature.{feature}\"), 0.0, 1.0, key=f\"alpha_{feature}\")\n    st.slider(tr(\"opt.beta\"), 0.0, 0.9, key=\"beta_slider\", help=tr(\"opt.beta_help\"))\n    if st.button(tr(\"opt.button\"), type=\"primary\"):\n        _optimise()\n    plan = st.session_state.plan\n    if plan is None:\n        st.info(tr(\"opt.empty\"))\n        return\n    weights = \", \".join(f\"{tr(f'feature.{feature}')} {plan.normalised_alphas[feature]:.2f}\" for feature in FEATURES)\n    st.write(tr(\"opt.weights\", weights=weights))\n    _render_filter(plan)\n\n\ndef _render_plan() -> None:\n    st.header(tr(\"plan.title\"))\n    plan = st.session_state.plan\n    if plan is None:\n        st.info(tr(\"plan.empty\"))\n        return\n    trip = _current_trip()\n    metrics = plan.metrics\n    cards = st.columns(4)\n    cards[0].metric(\n        tr(\"plan.floor\"),\n        tr(\"plan.floor_met\") if plan.meets_floor else tr(\"plan.floor_veto\"),\n        tr(\"plan.floor_delta\", beta=plan.beta),\n    )\n    cards[1].metric(\n        tr(\"plan.lowest\"),\n        f\"{metrics['lowest_satisfaction']:.2f}\",\n        tr(\"plan.gap\", gap=metrics[\"satisfaction_gap\"]),\n    )\n    product = metrics[\"nsw_product\"]\n    cards[2].metric(tr(\"plan.nsw\"), f\"{product:.3f}\" if isinstance(product, float) else \"—\")\n    entered = format_money(float(metrics.get(\"budget_entered\", metrics[\"budget_sgd\"])), str(metrics.get(\"budget_currency\", \"SGD\")))\n    cards[3].metric(\n        tr(\"plan.cost\"),\n        f\"SGD {metrics['known_cost_sgd']:.0f}\",\n        f\"{entered} → SGD {metrics['budget_sgd']:.0f}\",\n    )\n    st.write(floor_text(trip.members, plan.route.utilities, plan.beta, plan.meets_floor, lang()))\n    extra = st.columns(3)\n    detour = metrics[\"detour_ratio\"]\n    extra[0].write(tr(\"plan.detour\", value=detour) if isinstance(detour, float) else tr(\"plan.detour_none\"))\n    extra[1].write(tr(\"plan.pacing\", value=metrics[\"pacing_variance_hours\"]))\n    extra[2].write(tr(\"plan.violations\", count=metrics[\"hard_constraint_violations\"]))\n    st.caption(tr(\"plan.detour_help\"))\n    blocks = _constraint_lines(plan, trip.members)\n    if blocks:\n        st.subheader(tr(\"plan.blocks\"))\n        for note in blocks:\n            st.warning(note)\n    conflicts = _conflict_lines(plan, trip)\n    if conflicts:\n        st.subheader(tr(\"plan.unplaced\"))\n        for line in conflicts:\n            st.error(line)\n    st.subheader(tr(\"plan.satisfaction\"))\n    for member_id, utility in zip(plan.route.scores, plan.route.utilities):\n        member = next((item for item in st.session_state.members if item.id == member_id), None)\n        name = member.name if member else member_id\n        label = plan.pseudonyms.get(member_id, \"pseudonym\")\n        weight = member.weight if member else \"\"\n        st.write(tr(\"plan.member_line\", name=name, pseudo=label, utility=utility, weight=weight))\n    for day in plan.route.days:\n        forecast = illustrative_forecast(date.fromisoformat(day.day))\n        st.subheader(day.day)\n        condition = tr(_WX.get(forecast[\"condition\"], \"wx.warm\"))\n        risk = tr(_WX.get(forecast[\"rain_risk\"], \"risk.low\"))\n        st.caption(\n            tr(\"plan.window\", start=format_hm(day.start_min), end=format_hm(day.end_min))\n            + \" \"\n            + tr(\"plan.weather\", condition=condition, risk=risk, source=tr(\"wx.source\"), as_of=forecast[\"as_of\"])\n        )\n        if not day.stops:\n            st.write(tr(\"plan.no_stops\"))\n        for stop in day.stops:\n            venue = VENUE_BY_ID.get(stop.venue_id)\n            title = _named(stop.venue_id)\n            uncertain = []\n            if stop.uncertain_hours:\n                uncertain.append(tr(\"flag.hours_unknown\"))\n            if stop.uncertain_price:\n                uncertain.append(tr(\"flag.price_unknown\"))\n            suffix = f\" — {', '.join(uncertain)}\" if uncertain else \"\"\n            st.markdown(\n                f\"**{format_hm(stop.arrive_min)}–{format_hm(stop.depart_min)} {title}** \"\n                f\"({tr(f'role.{stop.role}')}{suffix})\"\n            )\n            if venue:\n                st.caption(\n                    tr(\n                        \"plan.travel\",\n                        minutes=stop.travel_min,\n                        mode=tr(f\"mode.{stop.travel_mode}\"),\n                        cost=stop.travel_cost,\n                        crowd=venue.crowd_estimate,\n                        updated=venue.last_updated,\n                    )\n                )\n        st.caption(\n            tr(\n                \"plan.back\",\n                minutes=day.return_travel_min,\n                mode=tr(f\"mode.{day.return_mode}\"),\n                cost=day.return_cost,\n                known=day.known_cost,\n            )\n        )\n    st.subheader(tr(\"plan.why_title\"))\n    for explanation in plan.explanations:\n        why, why_not, reversal = render_explanation(explanation, lang())\n        wording = tr(\"wording.model\") if explanation.wording == \"model\" and explanation.wording_lang == lang() else tr(\"wording.template\")\n        with st.expander(tr(\"plan.expander\", name=_named(explanation.venue_id), factor=tr(f\"feature.{explanation.top_factor}\"), wording=wording)):\n            st.write(why)\n            st.write(why_not)\n            st.write(reversal)\n    with st.expander(tr(\"plan.rephrase\")):\n        st.caption(tr(\"plan.rephrase_help\"))\n        if st.button(tr(\"plan.rephrase_button\")):\n            if not _ai_allowed():\n                st.session_state.model_note = \"plan.no_model\"\n            else:\n                updated, call = rephrase_explanations(\n                    trip,\n                    plan.explanations,\n                    llm=LLMClient(),\n                    ai_consent=True,\n                    lang=lang(),\n                )\n                plan.explanations = updated\n                st.session_state.plan = plan\n                st.session_state.model_note = call.rejection or \"plan.wording_ok\"\n                st.session_state.last_sent_payload = call.payload\n        if st.session_state.model_note:\n            _show_note(st.session_state.model_note)\n        if st.session_state.get(\"last_sent_payload\"):\n            st.caption(tr(\"plan.sent\"))\n            st.json(st.session_state.last_sent_payload)\n    st.subheader(tr(\"plan.change\"))\n    scheduled = [stop.venue_id for day in plan.route.days for stop in day.stops]\n    if not scheduled:\n        st.warning(tr(\"plan.no_schedule\"))\n        return\n    change = st.columns(2)\n    with change[0]:\n        reject_id = st.selectbox(tr(\"plan.reject\"), scheduled, format_func=_named, key=\"reject_id\")\n        if st.button(tr(\"plan.reject_button\")):\n            if reject_id not in st.session_state.excluded:\n                st.session_state.excluded.append(reject_id)\n            st.session_state.musts = [must for must in st.session_state.musts if must.venue_id != reject_id]\n            _optimise()\n            st.rerun()\n    with change[1]:\n        swap_from = st.selectbox(tr(\"plan.swap\"), scheduled, format_func=_named, key=\"swap_from\")\n        options = [venue.id for venue in VENUES if venue.id not in scheduled and venue.id not in st.session_state.excluded]\n        swap_to = st.selectbox(\n            tr(\"plan.with\"),\n            options or [\"\"],\n            format_func=lambda item: _named(item) if item in VENUE_BY_ID else tr(\"plan.no_replacement\"),\n            key=\"swap_to\",\n        )\n        if st.button(tr(\"plan.swap_button\")) and swap_to:\n            if swap_from not in st.session_state.excluded:\n                st.session_state.excluded.append(swap_from)\n            st.session_state.musts = [must for must in st.session_state.musts if must.venue_id != swap_from]\n            st.session_state.musts.append(MustVisit(swap_to, \"FLEXIBLE\"))\n            _optimise()\n            st.rerun()\n    st.caption(tr(\"plan.sliders\"))\n    if st.button(tr(\"plan.confirm\")):\n        st.session_state.confirmed = True\n    if not st.session_state.confirmed:\n        st.info(tr(\"plan.proposal\"))\n        return\n    st.success(tr(\"plan.confirmed\"))\n    st.subheader(tr(\"plan.replan\"))\n    replan = st.columns(3)\n    replan[0].selectbox(\n        tr(\"plan.weather_scenario\"),\n        [\"forecast\", \"heavy_rain\"],\n        format_func=lambda value: tr(f\"weather.{value}\"),\n        key=\"weather_input\",\n    )\n    replan[1].number_input(tr(\"plan.delay\"), min_value=0, max_value=240, step=15, key=\"delay_input\")\n    if replan[2].button(tr(\"plan.reopt\")):\n        _optimise()\n        st.rerun()\n    st.caption(tr(\"plan.replan_help\"))\n    st.subheader(tr(\"plan.rate\"))\n    st.caption(tr(\"plan.rate_help\"))\n    rate_cols = st.columns(3)\n    rate_venue = rate_cols[0].selectbox(tr(\"plan.stop\"), scheduled, format_func=_named, key=\"rate_venue\")\n    rate_member = rate_cols[1].selectbox(\n        tr(\"plan.as\"),\n        [member.id for member in trip.members],\n        format_func=lambda item: next(member.name for member in trip.members if member.id == item),\n        key=\"rate_member\",\n    )\n    rating = rate_cols[2].select_slider(tr(\"plan.rating\"), options=[1, 2, 3, 4, 5], value=4)\n    if st.button(tr(\"plan.save_rating\")):\n        member = next(item for item in st.session_state.members if item.id == rate_member)\n        venue = VENUE_BY_ID[rate_venue]\n        updated, message = apply_member_feedback(\n            member,\n            venue,\n            rating_to_signal(int(rating)),\n            personalisation_consent=bool(st.session_state.personal_consent),\n            lang=lang(),\n        )\n        st.session_state.members = [updated if item.id == updated.id else item for item in st.session_state.members]\n        if st.session_state.personal_consent:\n            for interest, value in updated.preferences.items():\n                st.session_state[f\"pref_{updated.id}_{interest}\"] = value\n        st.session_state.feedback.append(message)\n    for message in st.session_state.feedback[-4:]:\n        st.caption(message)\n    with st.expander(tr(\"plan.heuristic\")):\n        st.write(tr(\"heuristic.note\"))\n        st.write(tr(\"plan.formula\"))\n\n\ndef main() -> None:\n    _init()\n    st.session_state.setdefault(\"lang\", DEFAULT_LANG)\n    st.session_state.setdefault(\"start_date_input\", st.session_state.start_date)\n    st.session_state.setdefault(\"end_date_input\", st.session_state.end_date)\n    st.session_state.setdefault(\"day_start_input\", st.session_state.day_start)\n    st.session_state.setdefault(\"day_end_input\", st.session_state.day_end)\n    st.session_state.setdefault(\"budget_input\", st.session_state.budget)\n    st.session_state.setdefault(\"budget_currency\", st.session_state.budget_currency)\n    st.session_state.setdefault(\"fx_cache\", {})\n    st.session_state.setdefault(\"modes_input\", st.session_state.modes)\n    st.session_state.setdefault(\"abode_label_input\", st.session_state.abode_label)\n    st.session_state.setdefault(\"abode_address_input\", st.session_state.abode_address)\n    st.session_state.setdefault(\"beta_slider\", st.session_state.beta)\n    st.session_state.setdefault(\"weather_input\", st.session_state.weather)\n    st.session_state.setdefault(\"delay_input\", st.session_state.delay_minutes)\n    for feature in FEATURES:\n        st.session_state.setdefault(f\"alpha_{feature}\", float(st.session_state.alphas.get(feature, 0.25)))\n\n    with st.sidebar:\n        st.radio(\n            tr(\"lang.label\"),\n            [\"zh\", \"en\"],\n            format_func=lambda value: tr(f\"lang.{value}\"),\n            horizontal=True,\n            key=\"lang\",\n        )\n        st.header(tr(\"nav.session\"))\n        if st.button(tr(\"nav.sample\"), type=\"primary\"):\n            _load_sample()\n            st.rerun()\n        if st.button(tr(\"nav.clear\")):\n            _clear()\n            st.rerun()\n        st.caption(tr(\"nav.clear_help\"))\n        state = tr(\"status.on\") if st.session_state.ai_consent else tr(\"status.off\")\n        st.write(tr(\"status.ai\", state=state))\n        state = tr(\"status.on\") if st.session_state.personal_consent else tr(\"status.off\")\n        st.write(tr(\"status.personal\", state=state))\n        state = tr(\"status.confirmed\") if st.session_state.confirmed else tr(\"status.draft\")\n        st.write(tr(\"status.plan\", state=state))\n    _render_banner()\n    input_tab, privacy_tab, optimise_tab, plan_tab = st.tabs(\n        [tr(\"tab.input\"), tr(\"tab.privacy\"), tr(\"tab.optimise\"), tr(\"tab.explain\")]\n    )\n    with input_tab:\n        _render_inputs()\n    with privacy_tab:\n        _render_privacy()\n    with optimise_tab:\n        _render_optimise()\n    with plan_tab:\n        _render_plan()\n\n\nmain()\n",
 "triper/__init__.py": "\"\"\"Triper: a group trip planner with local scoring, fairness, and routing.\n\nThe pretrained language model is optional and is limited to unstructured\ntext (imported-link parsing and explanation wording). It does not rank\nvenues or choose the itinerary.\n\"\"\"\n\n__version__ = \"0.1.0\"\n",
 "triper/constraints.py": "\"\"\"Deterministic hard-constraint filter.\n\nDiet, accessibility, opening hours, and budget are applied before scoring.\nCriterion weights and member influence cannot put a rejected venue back.\nFIXED and FLEXIBLE must-visits that fail are reported; they are not forced in.\n\nMissing opening hours or prices are flagged and kept. They are not guessed\nand they are not treated as violations.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom datetime import date\n\nfrom triper.models import Member, TripInput, Venue, weekday_key\nfrom triper.money import planning_budget_sgd\n\n\n@dataclass\nclass GroupConstraints:\n    diets: set[str]\n    accessibility: set[str]\n\n\n@dataclass\nclass DroppedVenue:\n    venue_id: str\n    name: str\n    reasons: list[str]\n    detail: str\n\n\n@dataclass\nclass KeptVenue:\n    venue: Venue\n    flags: list[str] = field(default_factory=list)\n\n\n@dataclass\nclass FilterResult:\n    kept: list[KeptVenue]\n    dropped: list[DroppedVenue]\n    constraints: GroupConstraints\n\n\ndef group_constraints(members: list[Member]) -> GroupConstraints:\n    \"\"\"Union of needs. The result is not attached to any member's name.\"\"\"\n    diets: set[str] = set()\n    access: set[str] = set()\n    for member in members:\n        diets.update(member.diets)\n        access.update(member.accessibility)\n    return GroupConstraints(diets=diets, accessibility=access)\n\n\ndef _hours_overlap(venue: Venue, trip: TripInput) -> bool:\n    \"\"\"True when some trip day can host at least a short visit inside the window.\"\"\"\n    if not venue.hours_known or venue.hours is None:\n        return True\n    day_start_h, day_start_m = trip.day_start.split(\":\")\n    day_end_h, day_end_m = trip.day_end.split(\":\")\n    window_start = int(day_start_h) * 60 + int(day_start_m)\n    window_end = int(day_end_h) * 60 + int(day_end_m)\n    needed = min(30, venue.duration_min)\n    for day in trip.dates():\n        span = venue.hours.get(weekday_key(day))\n        if span is None:\n            continue\n        start = max(span[0], window_start)\n        end = min(span[1], window_end)\n        if end - start >= needed:\n            return True\n    return False\n\n\ndef _catalogue_stale(last_updated: str, trip_start: str, max_age_days: int = 365) -> bool:\n    try:\n        age = date.fromisoformat(trip_start) - date.fromisoformat(last_updated)\n    except ValueError:\n        return True\n    return age.days > max_age_days\n\n\ndef _diet_violation(venue: Venue, diets: set[str]) -> bool:\n    if not diets:\n        return False\n    if not venue.serves_food and venue.category != \"food\":\n        return False\n    return any(need not in venue.diets_supported for need in diets)\n\n\ndef _access_violation(venue: Venue, access: set[str]) -> bool:\n    if \"wheelchair\" in access and not venue.wheelchair_accessible:\n        return True\n    if \"step_free\" in access and not venue.step_free:\n        return True\n    return False\n\n\ndef filter_venues(venues: list[Venue], trip: TripInput) -> FilterResult:\n    constraints = group_constraints(trip.members)\n    party = max(1, len(trip.members))\n    kept: list[KeptVenue] = []\n    dropped: list[DroppedVenue] = []\n    excluded = set(trip.excluded_venue_ids)\n    for venue in venues:\n        reasons: list[str] = []\n        if venue.id in excluded:\n            reasons.append(\"rejected\")\n        if _diet_violation(venue, constraints.diets):\n            reasons.append(\"diet\")\n        if _access_violation(venue, constraints.accessibility):\n            reasons.append(\"accessibility\")\n        if venue.hours_known and not _hours_overlap(venue, trip):\n            reasons.append(\"hours\")\n        if (\n            venue.price_per_person_sgd is not None\n            and venue.price_per_person_sgd * party > planning_budget_sgd(trip) + 1e-6\n        ):\n            reasons.append(\"budget\")\n        if trip.weather_scenario == \"heavy_rain\" and venue.weather_sensitive:\n            reasons.append(\"weather\")\n        if reasons:\n            dropped.append(\n                DroppedVenue(\n                    venue_id=venue.id,\n                    name=venue.name,\n                    reasons=reasons,\n                    detail=_detail(reasons),\n                )\n            )\n            continue\n        flags: list[str] = [\"crowd_estimate\"]\n        if not venue.hours_known:\n            flags.append(\"uncertain_hours\")\n        if not venue.price_known:\n            flags.append(\"uncertain_price\")\n        if _catalogue_stale(venue.last_updated, trip.start_date):\n            flags.append(\"stale_catalogue\")\n        kept.append(KeptVenue(venue=venue, flags=flags))\n    return FilterResult(kept=kept, dropped=dropped, constraints=constraints)\n\n\ndef _detail(reasons: list[str]) -> str:\n    phrases = {\n        \"diet\": \"does not meet the group's dietary requirement\",\n        \"accessibility\": \"does not meet the group's accessibility requirement\",\n        \"hours\": \"is closed throughout the trip's days and hours\",\n        \"budget\": \"has a known price above the group budget\",\n        \"weather\": \"is weather-sensitive and the heavy-rain scenario is on\",\n        \"rejected\": \"was rejected for this plan\",\n    }\n    return \"; \".join(phrases[reason] for reason in reasons)\n\n\ndef drop_reason_text(reason: str) -> str:\n    return {\n        \"diet\": \"it does not meet the group's dietary requirement\",\n        \"accessibility\": \"it does not meet the group's accessibility requirement\",\n        \"hours\": \"it is closed during the trip's days and hours\",\n        \"budget\": \"its known price exceeds the group budget\",\n        \"weather\": \"it is unsuitable in the selected heavy-rain scenario\",\n        \"rejected\": \"it was rejected for this plan\",\n    }.get(reason, reason)\n",
 "triper/deidentify.py": "\"\"\"De-identification gateway.\n\nThe model never receives the raw trip record. Names, emails, booking\nreferences, and the precise abode address are removed or replaced with\nPerson A, Person B, and so on. Diet and accessibility stay out of the\npayload entirely; they are group hard constraints applied locally.\n\nAllowlisted fields: trip dates, budget, interests, pace, agreed weightage,\nimported-link path and caption, an area or start-node label, and (for\nwording only) score facts that were already computed locally.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport re\nfrom urllib.parse import unquote, urlparse\n\nfrom triper.models import INTERESTS, LinkImport, Member, TripInput\nfrom triper.money import planning_budget_sgd\n\nALLOWLIST: frozenset[str] = frozenset(\n    {\n        \"purpose\",\n        \"trip_dates\",\n        \"budget_sgd\",\n        \"interests\",\n        \"pace\",\n        \"weightage\",\n        \"links\",\n        \"start_node_label\",\n        \"score_facts\",\n    }\n)\n\n_EMAIL_RE = re.compile(r\"[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}\", re.IGNORECASE)\n_HANDLE_RE = re.compile(r\"@[A-Za-z0-9._]+\")\n# Stops at whitespace and at characters that are not part of a URL, so a\n# Chinese share card does not glue the following caption onto the link.\n_URL_RE = re.compile(r\"https?://[A-Za-z0-9._~:/?#\\[\\]@!$&'()*+,;=%\\-]+\", re.IGNORECASE)\n_PHONE_RE = re.compile(r\"(?:\\+\\d{1,3}[\\s-]?)?(?:\\(?\\d{2,4}\\)?[\\s-]?)?\\d{3,4}[\\s-]?\\d{3,4}\")\n_BOOKING_RE = re.compile(r\"\\b[A-Z]{2,6}-\\d{3,}\\b\")\n_PLATFORM_SEGMENTS = {\n    \"www\",\n    \"video\",\n    \"videos\",\n    \"p\",\n    \"reel\",\n    \"reels\",\n    \"tv\",\n    \"maps\",\n    \"place\",\n    \"search\",\n    \"explore\",\n    \"stories\",\n    \"share\",\n    \"dir\",\n    \"data\",\n    \"watch\",\n}\n\n\nclass PayloadRejected(ValueError):\n    \"\"\"Raised when a payload still contains a disallowed identifier.\"\"\"\n\n\ndef pseudonym(index: int) -> str:\n    \"\"\"0 -> Person A, 1 -> Person B, 26 -> Person AA.\"\"\"\n    letters = \"\"\n    number = index\n    while True:\n        letters = chr(ord(\"A\") + number % 26) + letters\n        number = number // 26 - 1\n        if number < 0:\n            break\n    return f\"Person {letters}\"\n\n\ndef assign_pseudonyms(members: list[Member]) -> dict[str, str]:\n    \"\"\"Stable pseudonyms in the order the group entered members.\"\"\"\n    return {member.id: pseudonym(index) for index, member in enumerate(members)}\n\n\ndef _tokens(text: str) -> list[str]:\n    return re.findall(r\"[a-z0-9]+\", text.lower())\n\n\ndef address_fragments(address: str, area_label: str) -> list[str]:\n    \"\"\"Pieces of the precise abode that must not leave the session.\"\"\"\n    fragments: list[str] = []\n    cleaned = address.strip()\n    if cleaned:\n        fragments.append(cleaned)\n    label_tokens = set(_tokens(area_label))\n    generic = {\"singapore\", \"road\", \"street\", \"drive\", \"avenue\", \"lane\", \"walk\", \"close\"}\n    for code in re.findall(r\"\\b\\d{6}\\b\", address):\n        fragments.append(code)\n    for unit in re.findall(r\"#\\s*\\d+\\s*-\\s*\\d+\", address):\n        fragments.append(re.sub(r\"\\s+\", \"\", unit))\n        fragments.append(unit)\n    for word in re.findall(r\"[A-Za-z]{4,}\", address):\n        if word.lower() not in label_tokens and word.lower() not in generic:\n            fragments.append(word)\n    # Longer fragments first so a full address is removed before its parts.\n    fragments.sort(key=len, reverse=True)\n    return fragments\n\n\ndef redact_free_text(text: str, members: list[Member], address: str, area_label: str) -> str:\n    \"\"\"Strip identifiers from a caption or URL fragment.\"\"\"\n    redacted = text or \"\"\n    redacted = _EMAIL_RE.sub(\"[redacted-email]\", redacted)\n    redacted = _HANDLE_RE.sub(\"[redacted-handle]\", redacted)\n    for member in members:\n        if member.email:\n            redacted = re.sub(re.escape(member.email), \"[redacted-email]\", redacted, flags=re.IGNORECASE)\n        if member.booking_ref:\n            redacted = re.sub(re.escape(member.booking_ref), \"[redacted-booking]\", redacted, flags=re.IGNORECASE)\n        if member.name.strip():\n            redacted = re.sub(re.escape(member.name.strip()), \"[redacted-name]\", redacted, flags=re.IGNORECASE)\n            for part in member.name.split():\n                if len(part) >= 3:\n                    redacted = re.sub(rf\"\\b{re.escape(part)}\\b\", \"[redacted-name]\", redacted, flags=re.IGNORECASE)\n    redacted = _BOOKING_RE.sub(\"[redacted-booking]\", redacted)\n    for fragment in address_fragments(address, area_label):\n        if fragment:\n            redacted = re.sub(re.escape(fragment), \"[redacted-address]\", redacted, flags=re.IGNORECASE)\n    redacted = _PHONE_RE.sub(\"[redacted-phone]\", redacted)\n    redacted = re.sub(r\"(?:\\[redacted-name\\]\\s*){2,}\", \"[redacted-name] \", redacted)\n    return re.sub(r\"\\s+\", \" \", redacted).strip()\n\n\ndef _trim_url(url: str) -> str:\n    return url.rstrip(\").,;，。、！!？?）】」》\\\"'\")\n\n\ndef share_links(text: str) -> list[tuple[str, str]]:\n    \"\"\"Pull every URL out of a pasted share card. Does not open the network.\"\"\"\n    found = [_trim_url(match.group(0)) for match in _URL_RE.finditer(text or \"\")]\n    caption = re.sub(r\"\\s+\", \" \", _URL_RE.sub(\" \", text or \"\")).strip()\n    return [(url, caption) for url in found]\n\n\ndef split_share_card(url: str, caption: str) -> tuple[str, str]:\n    \"\"\"Separate a pasted share card into a path and a caption.\n\n    Short links are not opened and redirects are not followed. Query strings\n    stay out of both pieces. If the paste has no URL, the original url field\n    is still read as a path.\n    \"\"\"\n    blob = \" \".join(part.strip() for part in (url, caption) if part and part.strip())\n    found = [_trim_url(match.group(0)) for match in _URL_RE.finditer(blob)]\n    if found:\n        paths = [url_path_for_model(item) for item in found]\n        leftover = _URL_RE.sub(\" \", blob)\n    else:\n        paths = [url_path_for_model(url)] if url else []\n        leftover = caption or \"\"\n    path = \" \".join(item for item in paths if item)\n    caption_text = re.sub(r\"\\s+\", \" \", leftover).strip()\n    return path, caption_text\n\n\ndef url_path_for_model(url: str) -> str:\n    \"\"\"Keep a place-like path and drop hosts, queries, handles, and opaque ids.\n\n    The page is never opened. Query strings (tracking tokens, emails) are\n    discarded. @handles are social-account identifiers and are removed.\n    \"\"\"\n    parsed = urlparse((url or \"\").strip())\n    raw = unquote(parsed.path or \"\").replace(\"+\", \" \")\n    kept: list[str] = []\n    for segment in raw.split(\"/\"):\n        segment = segment.strip()\n        if not segment or segment.startswith(\"@\"):\n            continue\n        lowered = segment.lower()\n        if lowered in _PLATFORM_SEGMENTS:\n            continue\n        if re.fullmatch(r\"\\d+\", segment):\n            continue\n        # Opaque social ids have no spaces. Hyphenated or spaced place names stay.\n        if \" \" not in segment and \"-\" not in segment and re.fullmatch(r\"[A-Za-z0-9_]{6,}\", segment):\n            continue\n        kept.append(segment)\n    return \"/\".join(kept)\n\n\ndef sanitise_link(link: LinkImport, members: list[Member], address: str, area_label: str) -> dict[str, str]:\n    path, caption = split_share_card(link.url, link.caption)\n    return {\n        \"url_path\": redact_free_text(path, members, address, area_label),\n        \"caption\": redact_free_text(caption, members, address, area_label),\n    }\n\n\ndef _assert_allowlist(payload: dict) -> None:\n    extra = set(payload) - ALLOWLIST\n    if extra:\n        raise PayloadRejected(f\"Payload has fields outside the allowlist: {sorted(extra)}\")\n\n\ndef _walk_strings(value: object) -> list[str]:\n    found: list[str] = []\n    if isinstance(value, str):\n        found.append(value)\n    elif isinstance(value, dict):\n        for key, item in value.items():\n            found.append(str(key))\n            found.extend(_walk_strings(item))\n    elif isinstance(value, (list, tuple)):\n        for item in value:\n            found.extend(_walk_strings(item))\n    return found\n\n\ndef assert_payload_safe(payload: dict, trip: TripInput) -> None:\n    \"\"\"Refuse to hand off a payload that still contains identifiers or sensitive labels.\"\"\"\n    _assert_allowlist(payload)\n    blob = json.dumps(payload, ensure_ascii=False)\n    lowered = blob.lower()\n    leaks: list[str] = []\n    for member in trip.members:\n        for secret in (member.name, member.email, member.booking_ref):\n            if secret and secret.lower() in lowered:\n                leaks.append(secret)\n        for part in member.name.split():\n            if len(part) >= 3 and re.search(rf\"\\b{re.escape(part.lower())}\\b\", lowered):\n                leaks.append(part)\n    for fragment in address_fragments(trip.abode_address, trip.abode_label):\n        if len(fragment) >= 3 and fragment.lower() in lowered:\n            leaks.append(fragment)\n    if _EMAIL_RE.search(blob):\n        leaks.append(\"email-pattern\")\n    if _HANDLE_RE.search(blob):\n        leaks.append(\"handle\")\n    # Diet and access needs are group constraints, not model inputs.\n    for key in (\"diet\", \"diets\", \"accessibility\", \"wheelchair\", \"booking_ref\", \"email\", \"abode_address\"):\n        if key in payload:\n            leaks.append(key)\n    if leaks:\n        raise PayloadRejected(\"Refusing model payload; identifiers still present: \" + \", \".join(sorted(set(leaks))))\n\n\ndef build_llm_payload(\n    trip: TripInput,\n    purpose: str,\n    score_facts: dict | None = None,\n    links: list[LinkImport] | None = None,\n) -> dict:\n    \"\"\"Build the only JSON that may be sent to the model.\n\n    `weightage` copies the agreed w_k. It is not rebalanced for fairness.\n    \"\"\"\n    pseudonyms = assign_pseudonyms(trip.members)\n    interests: dict[str, dict[str, float]] = {}\n    pace: dict[str, str] = {}\n    weightage: dict[str, float] = {}\n    for member in trip.members:\n        label = pseudonyms[member.id]\n        interests[label] = {key: round(float(member.preferences.get(key, 0.0)), 3) for key in INTERESTS}\n        pace[label] = member.pace\n        weightage[label] = float(member.weight)\n    payload: dict = {\n        \"purpose\": purpose,\n        \"trip_dates\": [trip.start_date, trip.end_date],\n        \"budget_sgd\": round(planning_budget_sgd(trip), 2),\n        \"interests\": interests,\n        \"pace\": pace,\n        \"weightage\": weightage,\n        \"links\": [\n            sanitise_link(link, trip.members, trip.abode_address, trip.abode_label)\n            for link in (trip.links if links is None else links)\n        ],\n        \"start_node_label\": trip.abode_label,\n    }\n    if score_facts is not None:\n        payload[\"score_facts\"] = score_facts\n    assert_payload_safe(payload, trip)\n    return payload\n",
 "triper/demo.py": "\"\"\"Print a sample plan. Useful without Streamlit: python -m triper.demo.\"\"\"\n\nfrom __future__ import annotations\n\nfrom triper.models import format_hm\nfrom triper.money import exchange_suggestion, format_money, format_rate\nfrom triper.pipeline import plan_trip\nfrom triper.sample import sample_trip\nfrom triper.venues import load_venues\n\n\ndef main() -> None:\n    trip = sample_trip()\n    result = plan_trip(trip)\n    names = {venue.id: venue.name for venue in load_venues()}\n    print(\"Triper sample plan\")\n    if trip.links:\n        print(f\"Sample import: {trip.links[0].url} (Xiaohongshu short link, not opened)\")\n    print(f\"Floor met: {result.meets_floor}\")\n    print(result.floor_message)\n    for member, utility in zip(trip.members, result.route.utilities):\n        print(f\"  {member.name}: U={utility:.3f}  weight={member.weight}\")\n    print(f\"NSW product: {result.metrics['nsw_product']}\")\n    hint = exchange_suggestion(trip.budget_sgd, trip.budget_currency, allow_network=False)\n    print(\n        f\"Budget: {format_money(hint.entered_amount, hint.entered_currency)} \"\n        f\"≈ {format_money(hint.converted_amount, hint.converted_currency)} \"\n        f\"({hint.source}, 1 {hint.rate_base} = {format_rate(hint.rate_value)} {hint.rate_quote}, {hint.as_of})\"\n    )\n    print(f\"Known cost: {result.metrics['known_cost_sgd']} / {result.metrics['budget_sgd']} SGD\")\n    print(f\"Hard-constraint violations: {result.metrics['hard_constraint_violations']}\")\n    for day in result.route.days:\n        print(f\"\\n{day.day}  {format_hm(day.start_min)}–{format_hm(day.end_min)}\")\n        for stop in day.stops:\n            flags = []\n            if stop.uncertain_hours:\n                flags.append(\"hours uncertain\")\n            if stop.uncertain_price:\n                flags.append(\"price uncertain\")\n            suffix = f\" [{', '.join(flags)}]\" if flags else \"\"\n            print(\n                f\"  {format_hm(stop.arrive_min)} {names.get(stop.venue_id, stop.venue_id)} \"\n                f\"({stop.role}, {stop.travel_min} min {stop.travel_mode}){suffix}\"\n            )\n        print(f\"  return {day.return_travel_min} min {day.return_mode}\")\n    if result.constraint_notes:\n        print(\"\\nHard constraints:\")\n        for line in result.constraint_notes:\n            print(f\"  - {line}\")\n    if result.route.conflicts:\n        print(\"\\nConflicts:\")\n        for line in result.route.conflicts:\n            print(f\"  - {line}\")\n    print(\"\\nExplanations:\")\n    for item in result.explanations:\n        print(f\"- {item.venue_name} [{item.top_factor}]\")\n        print(f\"  {item.why}\")\n        print(f\"  {item.why_not}\")\n        print(f\"  {item.reversal}\")\n\n\nif __name__ == \"__main__\":\n    main()\n",
 "triper/explain.py": "\"\"\"Contrastive explanations taken from the same scores that built the plan.\n\nThe largest contribution answers why a stop was chosen. The factor with the\nlargest score gap answers why a named alternative lost. The smallest single\ncriterion-weight change that reverses the pair is found by search, then the\nweights are renormalised exactly as scoring does. A hard-constraint rejection\nhas no weight-based reversal.\n\nTemplates are the source of truth. A model may only rephrase them, and only\nwhen the rephrased top factor still matches.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, replace\n\nfrom triper.i18n import feature_name, reason_phrase, t\nfrom triper.models import FEATURES, Member\nfrom triper.scoring import factor_label, score_features, top_factor\n\n\n@dataclass\nclass Explanation:\n    venue_id: str\n    venue_name: str\n    top_factor: str\n    contributions: dict[str, float]\n    alternative_id: str | None\n    alternative_name: str | None\n    gap_factor: str | None\n    why: str\n    why_not: str\n    reversal: str\n    wording: str = \"template\"\n    # Structured fields let the same scores be worded in Chinese or English.\n    anchor_role: str | None = None\n    omitted: tuple[str, ...] = ()\n    text_case: str = \"no_alternative\"\n    gap_value: float | None = None\n    chosen_group_score: float | None = None\n    alternative_group_score: float | None = None\n    reversal_feature: str | None = None\n    reversal_old: float | None = None\n    reversal_new: float | None = None\n    blocked_reason: str | None = None\n    wording_lang: str = \"en\"\n\n\ndef _group(\n    feature_rows: list[dict[str, float | None]],\n    weights: list[float],\n    alphas: dict[str, float],\n) -> tuple[float, dict[str, float], list[str]]:\n    total = 0.0\n    weight_sum = 0.0\n    contrib_acc: dict[str, float] = {}\n    contrib_weight: dict[str, float] = {}\n    omitted: set[str] = set()\n    for features, weight in zip(feature_rows, weights):\n        score, contributions, missing = score_features(features, alphas)\n        omitted.update(missing)\n        total += weight * score\n        weight_sum += weight\n        for feature, value in contributions.items():\n            contrib_acc[feature] = contrib_acc.get(feature, 0.0) + weight * value\n            contrib_weight[feature] = contrib_weight.get(feature, 0.0) + weight\n    if weight_sum <= 0:\n        return 0.0, {}, sorted(omitted)\n    contributions = {\n        feature: contrib_acc[feature] / contrib_weight[feature] for feature in contrib_acc\n    }\n    return total / weight_sum, contributions, sorted(omitted)\n\n\ndef _gap_factor(chosen: dict[str, float], alternative: dict[str, float]) -> str | None:\n    factors = set(chosen) | set(alternative)\n    if not factors:\n        return None\n    return max(factors, key=lambda feature: (chosen.get(feature, 0.0) - alternative.get(feature, 0.0), feature))\n\n\ndef smallest_weight_reversal(\n    chosen_rows: list[dict[str, float | None]],\n    alternative_rows: list[dict[str, float | None]],\n    weights: list[float],\n    alphas: dict[str, float],\n) -> tuple[str, float, float] | None:\n    \"\"\"Smallest absolute slider move on one criterion that reverses the group score.\n\n    Other sliders stay at their current raw values. Scoring renormalises the\n    full set, which is the same rule the optimiser uses. Returns\n    (feature, old_raw, new_raw) or None when no move inside [0, 1] works.\n    \"\"\"\n    base_chosen, _, _ = _group(chosen_rows, weights, alphas)\n    base_alternative, _, _ = _group(alternative_rows, weights, alphas)\n    if base_alternative > base_chosen + 1e-9:\n        return None\n    best: tuple[float, str, float, float] | None = None\n    for feature in FEATURES:\n        current = float(alphas.get(feature, 0.0))\n        for direction in (1.0, -1.0):\n            span = (1.0 - current) if direction > 0 else current\n            if span <= 1e-6:\n                continue\n            low = 0.0\n            high = span\n            found: float | None = None\n            for _ in range(18):\n                mid = (low + high) / 2.0\n                trial = dict(alphas)\n                trial[feature] = current + direction * mid\n                score_chosen, _, _ = _group(chosen_rows, weights, trial)\n                score_alternative, _, _ = _group(alternative_rows, weights, trial)\n                if score_alternative > score_chosen + 1e-9:\n                    found = mid\n                    high = mid\n                else:\n                    low = mid\n            if found is None:\n                continue\n            if best is None or found < best[0] - 1e-9:\n                best = (found, feature, current, current + direction * found)\n    if best is None:\n        return None\n    _, feature, old, new = best\n    return feature, old, new\n\n\ndef render_explanation(explanation: Explanation, lang: str = \"en\") -> tuple[str, str, str]:\n    \"\"\"Word a stored explanation. Model text is kept only in the language it was written.\"\"\"\n    if explanation.wording == \"model\" and explanation.wording_lang == lang:\n        return explanation.why, explanation.why_not, explanation.reversal\n    if explanation.anchor_role == \"anchor_timed\":\n        prefix = t(\"explain.prefix.timed\", lang, name=explanation.venue_name)\n    elif explanation.anchor_role == \"anchor_must\":\n        prefix = t(\"explain.prefix.must\", lang, name=explanation.venue_name)\n    else:\n        prefix = \"\"\n    if explanation.top_factor and explanation.contributions:\n        ordered = sorted(explanation.contributions, key=lambda feature: (-explanation.contributions[feature], feature))\n        parts = \", \".join(\n            f\"{feature_name(feature, lang)} ({explanation.contributions[feature]:.2f})\" for feature in ordered\n        )\n        why = t(\n            \"explain.why\",\n            lang,\n            prefix=prefix,\n            name=explanation.venue_name,\n            factor=feature_name(explanation.top_factor, lang),\n            parts=parts,\n        )\n        if explanation.omitted:\n            why += t(\n                \"explain.omitted\",\n                lang,\n                names=\", \".join(feature_name(feature, lang) for feature in explanation.omitted),\n            )\n    else:\n        why = t(\"explain.why_missing\", lang, prefix=prefix, name=explanation.venue_name)\n    name = explanation.venue_name\n    alt = explanation.alternative_name or \"\"\n    case = explanation.text_case\n    if case == \"blocked\":\n        why_not = t(\n            \"explain.why_not.blocked\",\n            lang,\n            alt=alt,\n            reason=reason_phrase(explanation.blocked_reason or \"\", lang),\n        )\n        reversal = t(\"explain.reversal.blocked\", lang, name=name, alt=alt)\n    elif case == \"no_factors\":\n        why_not = t(\"explain.why_not.no_factors\", lang, alt=alt)\n        reversal = t(\"explain.reversal.none\", lang)\n    elif case == \"higher\":\n        why_not = t(\n            \"explain.why_not.higher\",\n            lang,\n            alt=alt,\n            alt_score=explanation.alternative_group_score or 0.0,\n            chosen_score=explanation.chosen_group_score or 0.0,\n            factor=feature_name(explanation.gap_factor or \"\", lang),\n            gap=explanation.gap_value or 0.0,\n        )\n        reversal = t(\"explain.reversal.higher\", lang, alt=alt)\n    elif case == \"lower\":\n        why_not = t(\n            \"explain.why_not.lower\",\n            lang,\n            alt=alt,\n            factor=feature_name(explanation.gap_factor or \"\", lang),\n            gap=explanation.gap_value or 0.0,\n        )\n        if explanation.reversal_feature is None or explanation.reversal_new is None or explanation.reversal_old is None:\n            reversal = t(\"explain.reversal.no_flip\", lang, alt=alt, name=name)\n        else:\n            direction = t(\n                \"explain.raise\" if explanation.reversal_new > explanation.reversal_old else \"explain.lower\",\n                lang,\n            )\n            reversal = t(\n                \"explain.reversal.flip\",\n                lang,\n                direction=direction,\n                factor=feature_name(explanation.reversal_feature, lang),\n                old=explanation.reversal_old,\n                new=explanation.reversal_new,\n                alt=alt,\n                name=name,\n            )\n    else:\n        why_not = t(\"explain.why_not.none\", lang)\n        reversal = t(\"explain.reversal.none\", lang)\n    return why, why_not, reversal\n\n\ndef explain_pair(\n    venue_id: str,\n    venue_name: str,\n    chosen_rows: list[dict[str, float | None]],\n    weights: list[float],\n    alphas: dict[str, float],\n    alternative_id: str | None = None,\n    alternative_name: str | None = None,\n    alternative_rows: list[dict[str, float | None]] | None = None,\n    blocked_reason: str | None = None,\n    anchor_role: str | None = None,\n) -> Explanation:\n    \"\"\"Faithful explanation for one chosen venue against one named alternative.\"\"\"\n    _, contributions, omitted = _group(chosen_rows, weights, alphas)\n    leading = top_factor(contributions) or \"preference_match\"\n    gap_name: str | None = None\n    gap_value: float | None = None\n    chosen_score: float | None = None\n    alt_score: float | None = None\n    reversal_feature: str | None = None\n    reversal_old: float | None = None\n    reversal_new: float | None = None\n    text_case = \"no_alternative\"\n    if blocked_reason and alternative_name:\n        text_case = \"blocked\"\n    elif alternative_name and alternative_rows is not None:\n        alt_score, alt_contrib, _ = _group(alternative_rows, weights, alphas)\n        chosen_score, _, _ = _group(chosen_rows, weights, alphas)\n        gap_name = _gap_factor(contributions, alt_contrib)\n        if gap_name is not None:\n            gap_value = contributions.get(gap_name, 0.0) - alt_contrib.get(gap_name, 0.0)\n        if gap_name is None:\n            text_case = \"no_factors\"\n        elif alt_score > chosen_score + 1e-9:\n            text_case = \"higher\"\n        else:\n            text_case = \"lower\"\n            flip = smallest_weight_reversal(chosen_rows, alternative_rows, weights, alphas)\n            if flip is not None:\n                reversal_feature, reversal_old, reversal_new = flip\n    explanation = Explanation(\n        venue_id=venue_id,\n        venue_name=venue_name,\n        top_factor=leading,\n        contributions={key: round(value, 4) for key, value in contributions.items()},\n        alternative_id=alternative_id,\n        alternative_name=alternative_name,\n        gap_factor=gap_name,\n        why=\"\",\n        why_not=\"\",\n        reversal=\"\",\n        anchor_role=anchor_role,\n        omitted=tuple(omitted),\n        text_case=text_case,\n        gap_value=None if gap_value is None else round(gap_value, 4),\n        chosen_group_score=None if chosen_score is None else round(chosen_score, 4),\n        alternative_group_score=None if alt_score is None else round(alt_score, 4),\n        reversal_feature=reversal_feature,\n        reversal_old=None if reversal_old is None else round(reversal_old, 4),\n        reversal_new=None if reversal_new is None else round(reversal_new, 4),\n        blocked_reason=blocked_reason,\n    )\n    why, why_not, reversal = render_explanation(explanation, \"en\")\n    explanation.why = why\n    explanation.why_not = why_not\n    explanation.reversal = reversal\n    return explanation\n\n\ndef wording_is_faithful(explanation: Explanation, why: str, top: str, lang: str = \"en\") -> bool:\n    \"\"\"A rephrase is kept only when it still names the same top factor, in the UI language.\"\"\"\n    if top != explanation.top_factor:\n        return False\n    labels = {\n        explanation.top_factor,\n        factor_label(explanation.top_factor),\n        feature_name(explanation.top_factor, \"en\"),\n        feature_name(explanation.top_factor, \"zh\"),\n        feature_name(explanation.top_factor, lang),\n    }\n    lowered = why.lower()\n    if not any(label and label.lower() in lowered for label in labels):\n        return False\n    if lang == \"zh\":\n        return any(\"\\u4e00\" <= char <= \"\\u9fff\" for char in why)\n    return any(character.isascii() and character.isalpha() for character in why)\n\n\ndef apply_model_wording(\n    explanations: list[Explanation],\n    stops: list[dict[str, str]],\n    lang: str = \"en\",\n) -> tuple[list[Explanation], list[str]]:\n    \"\"\"Replace template sentences only where the model kept the true top factor.\"\"\"\n    by_id = {item[\"venue_id\"]: item for item in stops}\n    updated: list[Explanation] = []\n    notes: list[str] = []\n    for explanation in explanations:\n        item = by_id.get(explanation.venue_id)\n        if item is None:\n            updated.append(explanation)\n            continue\n        if not wording_is_faithful(explanation, item.get(\"why\", \"\"), item.get(\"top_factor\", \"\"), lang):\n            notes.append(explanation.venue_id)\n            updated.append(explanation)\n            continue\n        updated.append(\n            replace(\n                explanation,\n                why=item[\"why\"].strip(),\n                why_not=item.get(\"why_not\", explanation.why_not).strip(),\n                reversal=item.get(\"reversal\", explanation.reversal).strip(),\n                wording=\"model\",\n                wording_lang=lang,\n            )\n        )\n    return updated, notes\n\n\ndef member_weights(members: list[Member]) -> list[float]:\n    return [float(member.weight) for member in members]\n",
 "triper/fairness.py": "\"\"\"Weighted Nash social welfare with a satisfaction floor.\n\nMaximise prod_k U_k ** w_k, equivalently sum_k w_k * log(U_k),\nsubject to U_k >= beta for every member.\n\nw_k is the agreed influence. It is never rewritten to manufacture fairness.\nThe floor vetoes a plan that leaves someone below beta. If every compared\nplan fails the floor, search still prefers the plan that lifts more members\nover the floor and then the least-satisfied member.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nfrom dataclasses import dataclass\n\n\ndef weighted_nsw_product(utilities: list[float], weights: list[float]) -> float:\n    if len(utilities) != len(weights):\n        raise ValueError(\"Utilities and weights must be the same length.\")\n    if not utilities:\n        return 0.0\n    product = 1.0\n    for utility, weight in zip(utilities, weights):\n        if utility <= 0:\n            return 0.0\n        product *= utility ** weight\n    return product\n\n\ndef weighted_nsw_log(utilities: list[float], weights: list[float]) -> float:\n    if len(utilities) != len(weights):\n        raise ValueError(\"Utilities and weights must be the same length.\")\n    if not utilities:\n        return float(\"-inf\")\n    total = 0.0\n    for utility, weight in zip(utilities, weights):\n        if utility <= 0:\n            return float(\"-inf\")\n        total += weight * math.log(utility)\n    return total\n\n\ndef floor_failures(utilities: list[float], beta: float) -> list[int]:\n    return [index for index, utility in enumerate(utilities) if utility < beta]\n\n\n@dataclass\nclass PlanUtility:\n    utilities: list[float]\n    weights: list[float]\n    beta: float\n    day_length_penalty: float = 0.0\n    collected: float = 0.0\n\n    @property\n    def meets_floor(self) -> bool:\n        return bool(self.utilities) and all(utility >= self.beta for utility in self.utilities)\n\n    @property\n    def min_u(self) -> float:\n        return min(self.utilities) if self.utilities else 0.0\n\n    @property\n    def max_u(self) -> float:\n        return max(self.utilities) if self.utilities else 0.0\n\n    @property\n    def sum_u(self) -> float:\n        return float(sum(self.utilities))\n\n    @property\n    def gap(self) -> float:\n        return self.max_u - self.min_u\n\n    @property\n    def n_above_floor(self) -> int:\n        return sum(1 for utility in self.utilities if utility >= self.beta)\n\n    @property\n    def nsw_log(self) -> float:\n        return weighted_nsw_log(self.utilities, self.weights)\n\n    @property\n    def nsw_product(self) -> float:\n        return weighted_nsw_product(self.utilities, self.weights)\n\n    @property\n    def objective(self) -> float:\n        \"\"\"Collected orienteering prize minus a penalty for uneven days.\n\n        The prize is sum_k w_k * sum_v S_k(v). Maximising the product of\n        averaged utilities on its own collapses to a one-stop plan, because\n        U_k is a mean. The floor still vetoes a high-prize plan that leaves\n        someone below beta, and weighted NSW breaks ties.\n        \"\"\"\n        return self.collected - self.day_length_penalty\n\n\ndef plan_is_better(candidate: PlanUtility | None, incumbent: PlanUtility | None) -> bool:\n    \"\"\"True when the candidate should replace the incumbent.\n\n    A plan that clears the fairness floor outranks one that does not.\n    Among plans on the same side of the floor, the higher collected prize\n    (after the day-length penalty) wins. Near-ties break toward weighted\n    NSW and then the least-satisfied member. Weights are not modified.\n    \"\"\"\n    if candidate is None:\n        return False\n    if incumbent is None:\n        return True\n    if candidate.meets_floor != incumbent.meets_floor:\n        return candidate.meets_floor\n    if not candidate.meets_floor and not incumbent.meets_floor:\n        if candidate.n_above_floor != incumbent.n_above_floor:\n            return candidate.n_above_floor > incumbent.n_above_floor\n        if abs(candidate.min_u - incumbent.min_u) > 1e-6:\n            return candidate.min_u > incumbent.min_u\n    if candidate.objective > incumbent.objective + 1e-4:\n        return True\n    if incumbent.objective > candidate.objective + 1e-4:\n        return False\n    if math.isfinite(candidate.nsw_log) and math.isfinite(incumbent.nsw_log):\n        if abs(candidate.nsw_log - incumbent.nsw_log) > 1e-7:\n            return candidate.nsw_log > incumbent.nsw_log\n    return candidate.min_u > incumbent.min_u + 1e-6\n\n\ndef select_floor(\n    plans: list[list[float]],\n    betas: list[float] | None = None,\n) -> dict[str, float] | None:\n    \"\"\"Grid-search a floor on already simulated utility vectors.\n\n    Chooses the highest beta at which at least one plan is feasible, and\n    among such betas the one whose best NSW plan keeps the highest minimum\n    satisfaction. This does not rewrite member weights. It is an offline\n    helper for the default floor, not a model trained on user data.\n    \"\"\"\n    betas = betas or [0.3, 0.4, 0.5, 0.6, 0.7]\n    best: dict[str, float] | None = None\n    for beta in betas:\n        feasible = [plan for plan in plans if plan and all(utility >= beta for utility in plan)]\n        if not feasible:\n            continue\n        chosen = max(feasible, key=lambda plan: (min(plan), sum(plan)))\n        record = {\"beta\": beta, \"min_u\": min(chosen), \"sum_u\": float(sum(chosen))}\n        if best is None or record[\"beta\"] > best[\"beta\"] or (\n            record[\"beta\"] == best[\"beta\"] and record[\"min_u\"] > best[\"min_u\"]\n        ):\n            best = record\n    return best\n",

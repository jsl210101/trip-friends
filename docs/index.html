 allowed)\n    for must in dated:\n        node = Node(must.venue_id, \"anchor_must\", None, must.on_date)\n        place_must(must, node, [must.on_date] if must.on_date else None)\n    for must in flexible:\n        node = Node(must.venue_id, \"anchor_must\")\n        place_must(must, node, None)\n\n    candidates = [venue for venue in kept if venue.id not in _ids(days)]\n    while candidates:\n        incumbent = simulate(days, trip, venues, members)\n        best: tuple[dict[str, list[Node]], Evaluation, str] | None = None\n        for venue in candidates:\n            found = _best_insertion(\n                days,\n                Node(venue.id, \"optional\"),\n                trip,\n                venues,\n                members,\n                None,\n                optional_cap=True,\n            )\n            if found is None:\n                continue\n            trial_days, evaluation = found\n            if not _better_eval(evaluation, incumbent):\n                continue\n            if best is None or _better_eval(evaluation, best[1]):\n                best = (trial_days, evaluation, venue.id)\n        if best is None:\n            break\n        days.clear()\n        days.update(best[0])\n        chosen = best[2]\n        candidates = [venue for venue in candidates if venue.id != chosen]\n\n    ranked_pool = sorted(kept, key=lambda venue: _mean_preference(venue, members), reverse=True)[:REPLACEMENT_POOL]\n    # Replacements must be allowed to consider venues outside the top preference list\n    # only through the pool; anchors are already placed.\n    searched = _local_search(days, trip, venues, members, ranked_pool)\n    evaluation = simulate(searched, trip, venues, members)\n    if evaluation is None:\n        conflicts.append(\"The heuristic could not produce a feasible timetable for these constraints.\")\n        weights = [float(member.weight) for member in members]\n        empty = PlanUtility(utilities=[0.0 for _ in members], weights=weights, beta=trip.beta)\n        return RouteResult(\n            days=[],\n            utilities=empty.utilities,\n            weights=weights,\n            plan=empty,\n            scores={member.id: [] for member in members},\n            conflicts=conflicts,\n            total_known_cost=0.0,\n        )\n    return RouteResult(\n        days=evaluation.days,\n        utilities=evaluation.plan.utilities,\n        weights=list(evaluation.plan.weights),\n        plan=evaluation.plan,\n        scores=evaluation.scores,\n        conflicts=conflicts,\n        total_known_cost=evaluation.total_known_cost,\n    )\n\n\ndef travel_detour_ratio(trip: TripInput, days: list[ScheduledDay], venues: dict[str, Venue]) -> float | None:\n    \"\"\"Planned travel time divided by a travel-only nearest-neighbour order of the same stops.\n\n    This is an estimate of extra travel, not a proof of optimality. Values below 1\n    can appear when the timetable was forced onto a slower mode by the budget.\n    \"\"\"\n    party = max(1, len(trip.members))\n    ratios: list[float] = []\n    for day in days:\n        if not day.stops:\n            continue\n        planned = sum(stop.travel_min for stop in day.stops) + day.return_travel_min\n        pending = [venues[stop.venue_id] for stop in day.stops if stop.venue_id in venues]\n        lat, lon = trip.abode_lat, trip.abode_lon\n        nearest = 0\n        while pending:\n            ranked: list[tuple[int, Venue]] = []\n            for venue in pending:\n                leg = estimate_leg(\n                    lat, lon, venue.lat, venue.lon, trip.transport_modes, party, remaining_budget=None\n                )\n                ranked.append((leg.minutes if leg else 10**6, venue))\n            minutes, chosen = min(ranked, key=lambda item: (item[0], item[1].id))\n            nearest += minutes\n            lat, lon = chosen.lat, chosen.lon\n            pending = [venue for venue in pending if venue.id != chosen.id]\n        back = estimate_leg(lat, lon, trip.abode_lat, trip.abode_lon, trip.transport_modes, party, None)\n        nearest += back.minutes if back else 0\n        if nearest > 0:\n            ratios.append(planned / nearest)\n    if not ratios:\n        return None\n    return sum(ratios) / len(ratios)\n\n\ndef pacing_variance_hours(days: list[ScheduledDay]) -> float:\n    if not days:\n        return 0.0\n    hours = [day.activity_min / 60.0 for day in days]\n    mean = sum(hours) / len(hours)\n    return sum((hour - mean) ** 2 for hour in hours) / len(hours)\n\n\ndef describe_stop(stop: ScheduledStop) -> str:\n    return (\n        f\"{format_hm(stop.arrive_min)}–{format_hm(stop.depart_min)} \"\n        f\"after {stop.travel_min} min {stop.travel_mode} (estimate)\"\n    )\n",
 "triper/sample.py": "\"\"\"A fictional Singapore group used by the demo and the end-to-end test.\n\nNames, emails, and the booking references are invented. The precise abode\naddress is session data and must not appear in a model payload.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom triper.models import INTERESTS, LinkImport, Member, MustVisit, TripInput, blank_preferences\nfrom triper.pipeline import default_alphas\n\n\ndef _prefs(**values: float) -> dict[str, float]:\n    preferences = blank_preferences()\n    for key, value in values.items():\n        if key not in INTERESTS:\n            raise KeyError(key)\n        preferences[key] = value\n    return preferences\n\n\ndef sample_members() -> list[Member]:\n    return [\n        Member(\n            id=\"m1\",\n            name=\"Alex Chen\",\n            email=\"alex.chen@example.com\",\n            booking_ref=\"WF-1001\",\n            preferences=_prefs(shopping=0.9, food=0.7, nightlife=0.45),\n            pace=\"moderate\",\n            crowd_tolerance=0.7,\n            weight=1.0,\n        ),\n        Member(\n            id=\"m2\",\n            name=\"Mei Tan\",\n            email=\"mei.tan@example.com\",\n            booking_ref=\"WF-1002\",\n            preferences=_prefs(shopping=0.85, food=0.8),\n            pace=\"moderate\",\n            crowd_tolerance=0.6,\n            weight=1.0,\n        ),\n        Member(\n            id=\"m3\",\n            name=\"Jordan Lee\",\n            email=\"jordan.lee@example.com\",\n            booking_ref=\"WF-1003\",\n            preferences=_prefs(shopping=0.8, relaxation=0.55),\n            pace=\"moderate\",\n            crowd_tolerance=0.5,\n            weight=1.0,\n        ),\n        Member(\n            id=\"m4\",\n            name=\"Priya Raman\",\n            email=\"priya.raman@example.com\",\n            booking_ref=\"WF-1004\",\n            preferences=_prefs(nature=0.95, relaxation=0.7),\n            pace=\"moderate\",\n            crowd_tolerance=0.2,\n            diets=[\"halal\"],\n            accessibility=[\"wheelchair\"],\n            weight=1.0,\n        ),\n    ]\n\n\ndef sample_trip() -> TripInput:\n    \"\"\"Two days around Marina Bay, with one flexible must-visit and one imported link.\"\"\"\n    return TripInput(\n        start_date=\"2026-11-14\",\n        end_date=\"2026-11-15\",\n        day_start=\"09:30\",\n        day_end=\"21:00\",\n        budget_sgd=420.0,\n        budget_currency=\"SGD\",\n        transport_modes=[\"transit\", \"walk\"],\n        abode_label=\"Marina Bay area\",\n        abode_address=\"10 Bayfront Avenue, Singapore 018956\",\n        abode_lat=1.2830,\n        abode_lon=103.8600,\n        members=sample_members(),\n        must_visits=[\n            MustVisit(venue_id=\"botanic-gardens\", kind=\"FLEXIBLE\"),\n            # Confirmed high-confidence match from the imported link below.\n            MustVisit(venue_id=\"gardens-by-the-bay\", kind=\"FLEXIBLE\"),\n        ],\n        links=[\n            LinkImport(\n                url=\"http://xhslink.com/a/GbBay01?share_token=secret-token\",\n                caption=(\n                    \"Priya Raman 夜逛滨海湾花园 Gardens by the Bay. \"\n                    \"Email priya.raman@example.com ref WF-1004. \"\n                    \"Stay at 10 Bayfront Avenue, Singapore 018956. \"\n                    \"复制这段话，打开小红书查看\"\n                ),\n            )\n        ],\n        alphas=default_alphas(),\n        beta=0.5,\n    )\n",
 "triper/scoring.py": "\"\"\"Weighted linear activity scores.\n\nS_k(v) = sum_f alpha_f * x_f^(k)(v), with each x in [0, 1] and oriented\nso that higher is better. Criterion weights are normalised to sum to 1.\nIf a feature is missing (unknown price), it is omitted and the remaining\nweights are renormalised. The missing value is never guessed.\n\nPreference match is the interest-weighted average of the venue's 0–1\nattribute tags over interests that the member rates above zero.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom triper.models import FEATURES, FEATURE_LABELS, INTERESTS, Member, Venue\n\n# Reference points for unit-interval features. Documented approximations.\nTRAVEL_REF_MIN = 90.0\nCOST_REF_SGD = 60.0\n\n\ndef normalise_alphas(alphas: dict[str, float]) -> dict[str, float]:\n    \"\"\"Normalise criterion weights onto the simplex. Empty input becomes equal weights.\"\"\"\n    clean = {feature: max(0.0, float(alphas.get(feature, 0.0))) for feature in FEATURES}\n    total = sum(clean.values())\n    if total <= 0:\n        share = 1.0 / len(FEATURES)\n        return {feature: share for feature in FEATURES}\n    return {feature: clean[feature] / total for feature in FEATURES}\n\n\ndef preference_match(member: Member, venue: Venue) -> float:\n    weighted = [\n        (float(member.preferences.get(key, 0.0)), float(venue.tags.get(key, 0.0)))\n        for key in INTERESTS\n        if float(member.preferences.get(key, 0.0)) > 0\n    ]\n    if not weighted:\n        return 0.0\n    denominator = sum(weight for weight, _ in weighted)\n    return sum(weight * tag for weight, tag in weighted) / denominator\n\n\ndef feature_vector(\n    member: Member,\n    venue: Venue,\n    travel_min: float,\n) -> dict[str, float | None]:\n    \"\"\"Build x_f^(k)(v). Cost is None when the catalogue price is unknown.\n\n    Transport cost is enforced in the budget check, not inside this feature,\n    so a missing activity price is omitted rather than filled with the fare.\n    \"\"\"\n    travel = 1.0 - min(max(travel_min, 0.0), TRAVEL_REF_MIN) / TRAVEL_REF_MIN\n    if venue.price_per_person_sgd is None:\n        cost: float | None = None\n    else:\n        cost = 1.0 - min(max(venue.price_per_person_sgd, 0.0), COST_REF_SGD) / COST_REF_SGD\n    tolerance = min(1.0, max(0.0, member.crowd_tolerance))\n    crowd = 1.0 - min(1.0, max(0.0, venue.crowd_estimate)) * (1.0 - tolerance)\n    return {\n        \"preference_match\": preference_match(member, venue),\n        \"travel_time\": min(1.0, max(0.0, travel)),\n        \"cost\": None if cost is None else min(1.0, max(0.0, cost)),\n        \"crowd\": min(1.0, max(0.0, crowd)),\n    }\n\n\ndef score_features(\n    features: dict[str, float | None],\n    alphas: dict[str, float],\n) -> tuple[float, dict[str, float], list[str]]:\n    \"\"\"Return S, per-feature contributions, and omitted feature names.\n\n    Contributions already include the normalised weight, so they sum to S.\n    \"\"\"\n    present = {feature: float(features[feature]) for feature in FEATURES if features.get(feature) is not None}\n    omitted = [feature for feature in FEATURES if feature not in present]\n    base = normalise_alphas(alphas)\n    if not present:\n        return 0.0, {}, omitted\n    weight_sum = sum(base[feature] for feature in present)\n    contributions = {feature: (base[feature] / weight_sum) * present[feature] for feature in present}\n    return sum(contributions.values()), contributions, omitted\n\n\ndef score_member_venue(\n    member: Member,\n    venue: Venue,\n    alphas: dict[str, float],\n    travel_min: float,\n) -> tuple[float, dict[str, float], list[str]]:\n    return score_features(feature_vector(member, venue, travel_min), alphas)\n\n\ndef top_factor(contributions: dict[str, float]) -> str | None:\n    if not contributions:\n        return None\n    return max(contributions, key=lambda feature: (contributions[feature], feature))\n\n\ndef factor_label(feature: str) -> str:\n    return FEATURE_LABELS.get(feature, feature.replace(\"_\", \" \"))\n\n\ndef normalise_satisfaction(scores: list[float]) -> float:\n    \"\"\"U from the mean of S_k(v), scaled to [0, 1].\n\n    Each S_k(v) is already on [0, 1] because features are normalised and\n    criterion weights sum to 1. Normalise therefore clips the mean.\n    An empty itinerary has no satisfaction (0), which the fairness floor\n    rejects whenever beta > 0.\n    \"\"\"\n    if not scores:\n        return 0.0\n    mean = sum(scores) / len(scores)\n    return min(1.0, max(0.0, mean))\n",
 "triper/venues.py": "\"\"\"Offline Singapore catalogue for a one- or two-day demo.\n\nHours, prices, access, and diet flags are curated illustrations with a\nsource note and a last-reviewed date. They are not a live feed. Missing\nhours or prices stay missing. Crowd levels are estimates.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom triper.models import INTERESTS, WEEKDAYS, Venue, parse_hm\n\nSOURCE = (\n    \"Illustrative offline catalogue for the Triper demo \"\n    \"(not a live OneMap, LTA DataMall, or data.gov.sg feed)\"\n)\n\n\ndef _tags(**values: float) -> dict[str, float]:\n    tags = {key: 0.0 for key in INTERESTS}\n    tags.update(values)\n    return tags\n\n\ndef _hours(open_hm: str, close_hm: str, closed: tuple[str, ...] = ()) -> dict[str, tuple[int, int] | None]:\n    span = (parse_hm(open_hm), parse_hm(close_hm))\n    return {day: None if day in closed else span for day in WEEKDAYS}\n\n\ndef _venue(\n    id_: str,\n    name: str,\n    area: str,\n    lat: float,\n    lon: float,\n    category: str,\n    tags: dict[str, float],\n    duration: int,\n    price: float | None,\n    hours: dict[str, tuple[int, int] | None] | None,\n    *,\n    aliases: list[str] | None = None,\n    diets: set[str] | None = None,\n    serves_food: bool = False,\n    wheelchair: bool = True,\n    step_free: bool = True,\n    crowd: float = 0.5,\n    indoor: bool = True,\n    weather: bool = False,\n    updated: str = \"2026-09-01\",\n    notes: str = \"\",\n) -> Venue:\n    return Venue(\n        id=id_,\n        name=name,\n        aliases=aliases or [],\n        area=area,\n        lat=lat,\n        lon=lon,\n        category=category,\n        tags=tags,\n        duration_min=duration,\n        price_per_person_sgd=price,\n        hours=hours,\n        diets_supported=set(diets or ()),\n        serves_food=serves_food,\n        wheelchair_accessible=wheelchair,\n        step_free=step_free,\n        crowd_estimate=crowd,\n        indoor=indoor,\n        weather_sensitive=weather,\n        source=SOURCE,\n        last_updated=updated,\n        notes=notes,\n    )\n\n\n_ZH_ALIASES: dict[str, tuple[str, ...]] = {\n    \"gardens-by-the-bay\": (\"滨海湾花园\",),\n    \"botanic-gardens\": (\"新加坡植物园\", \"植物园\"),\n    \"east-coast-park\": (\"东海岸公园\",),\n    \"palawan-beach\": (\"巴拉湾海滩\", \"圣淘沙\"),\n    \"singapore-zoo\": (\"新加坡动物园\",),\n    \"night-safari\": (\"夜间野生动物园\",),\n    \"jewel-changi\": (\"星耀樟宜\",),\n    \"national-gallery\": (\"新加坡国家美术馆\",),\n    \"merlion-park\": (\"鱼尾狮公园\", \"鱼尾狮\"),\n    \"ion-orchard\": (\"乌节路ION\",),\n    \"bugis-street\": (\"武吉士街\",),\n    \"haji-lane\": (\"哈芝巷\",),\n    \"maxwell-food-centre\": (\"麦士威熟食中心\",),\n    \"lau-pa-sat\": (\"老巴刹\",),\n    \"song-fa-bak-kut-teh\": (\"松发肉骨茶\",),\n    \"zam-zam\": (\"赞赞餐厅\",),\n    \"hjh-maimunah\": (\"迈慕娜\",),\n    \"clarke-quay\": (\"克拉码头\",),\n    \"marina-bay-waterfront\": (\"滨海湾滨水步道\",),\n    \"mbs-skypark\": (\"滨海湾金沙空中公园\",),\n}\n\n\ndef load_venues() -> list[Venue]:\n    venues = [\n        _venue(\n            \"gardens-by-the-bay\",\n            \"Gardens by the Bay\",\n            \"Marina Bay\",\n            1.2816,\n            103.8636,\n            \"nature\",\n            _tags(nature=0.95, relaxation=0.7, culture=0.25),\n            120,\n            28,\n            _hours(\"09:00\", \"21:00\"),\n            aliases=[\"gardens by the bay\", \"bay gardens\", \"supertree grove\"],\n            crowd=0.72,\n            indoor=False,\n            weather=True,\n            notes=\"Conservatory price is an illustrative per-person estimate. Outdoor grounds are weather-sensitive.\",\n        ),\n        _venue(\n            \"botanic-gardens\",\n            \"Singapore Botanic Gardens\",\n            \"Tanglin\",\n            1.3138,\n            103.8159,\n            \"nature\",\n            _tags(nature=1.0, relaxation=0.85, culture=0.2),\n            90,\n            0,\n            _hours(\"07:00\", \"22:00\"),\n            aliases=[\"botanic gardens

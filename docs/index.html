 "triper/geo.py": "\"\"\"Travel-time and fare estimates.\n\nThese are haversine approximations with fixed speeds. They are not live\nOneMap routes or LTA fares, and every figure is labelled an estimate.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nfrom dataclasses import dataclass\n\nEARTH_KM = 6371.0\n\nMODE_SPECS: dict[str, dict[str, float]] = {\n    \"walk\": {\"kmh\": 4.5, \"wait_min\": 0.0},\n    \"transit\": {\"kmh\": 22.0, \"wait_min\": 8.0},\n    \"ride_hail\": {\"kmh\": 30.0, \"wait_min\": 5.0},\n}\n\nTRAVEL_SOURCE = \"Haversine distance with fixed mode speeds (not a live OneMap route)\"\n\n\n@dataclass(frozen=True)\nclass LegEstimate:\n    mode: str\n    minutes: int\n    cost_sgd: float\n    distance_km: float\n    is_estimate: bool = True\n    source: str = TRAVEL_SOURCE\n\n\ndef haversine_km(lat1: float, lon1: float, lat2: float, lon2: float) -> float:\n    p1 = math.radians(lat1)\n    p2 = math.radians(lat2)\n    dp = math.radians(lat2 - lat1)\n    dl = math.radians(lon2 - lon1)\n    a = math.sin(dp / 2) ** 2 + math.cos(p1) * math.cos(p2) * math.sin(dl / 2) ** 2\n    return 2 * EARTH_KM * math.asin(math.sqrt(a))\n\n\ndef _mode_cost(mode: str, distance_km: float, party_size: int) -> float:\n    party = max(1, party_size)\n    if mode == \"walk\":\n        return 0.0\n    if mode == \"transit\":\n        per_person = min(2.60, 0.92 + 0.08 * distance_km)\n        return round(per_person * party, 2)\n    if mode == \"ride_hail\":\n        vehicles = max(1, math.ceil(party / 4))\n        return round(vehicles * (4.0 + 1.05 * distance_km), 2)\n    raise KeyError(mode)\n\n\ndef estimate_leg(\n    lat1: float,\n    lon1: float,\n    lat2: float,\n    lon2: float,\n    modes: list[str],\n    party_size: int,\n    remaining_budget: float | None = None,\n) -> LegEstimate | None:\n    \"\"\"Fastest selected mode whose estimated fare still fits the remaining budget.\n\n    Returns None when every selected mode is over the remaining budget.\n    A zero or negative remaining budget still allows a free walk.\n    \"\"\"\n    selected = [mode for mode in modes if mode in MODE_SPECS]\n    if not selected:\n        selected = [\"walk\"]\n    distance = haversine_km(lat1, lon1, lat2, lon2)\n    options: list[LegEstimate] = []\n    for mode in selected:\n        spec = MODE_SPECS[mode]\n        if distance < 0.05:\n            minutes = 1\n        else:\n            minutes = int(round(spec[\"wait_min\"] + distance / spec[\"kmh\"] * 60.0))\n            minutes = max(1, minutes)\n        cost = _mode_cost(mode, distance, party_size)\n        options.append(LegEstimate(mode=mode, minutes=minutes, cost_sgd=cost, distance_km=round(distance, 3)))\n    options.sort(key=lambda leg: (leg.minutes, leg.cost_sgd, leg.mode))\n    if remaining_budget is None:\n        return options[0]\n    for leg in options:\n        if leg.cost_sgd <= remaining_budget + 1e-6:\n            return leg\n    return None\n",
 "triper/i18n.py": "\"\"\"Chinese and English copy for the session UI.\n\nThe planner's numbers do not depend on this module. Templates only change\nhow a result is worded. Missing Chinese keys fall back to English, and a\ntest checks that the two catalogues stay in step.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom triper.models import Member\n\nDEFAULT_LANG = \"zh\"\nLANGS = (\"zh\", \"en\")\n\nEN: dict[str, str] = {\n    \"lang.label\": \"Language\",\n    \"lang.zh\": \"中文\",\n    \"lang.en\": \"English\",\n    \"nav.session\": \"Session\",\n    \"nav.sample\": \"Load sample Singapore trip\",\n    \"nav.clear\": \"Clear all my data\",\n    \"nav.clear_help\": \"Clearing discards travellers, links, the plan, and ratings. There is no account table.\",\n    \"status.ai\": \"AI consent: {state}\",\n    \"status.personal\": \"Personalisation: {state}\",\n    \"status.plan\": \"Plan: {state}\",\n    \"status.on\": \"on\",\n    \"status.off\": \"off\",\n    \"status.confirmed\": \"confirmed\",\n    \"status.draft\": \"not confirmed\",\n    \"banner.body\": \"A group itinerary planner. Hard constraints, scores, weighted Nash social welfare, and the route are computed in this session. A model, if used at all, only reads de-identified text.\",\n    \"tab.input\": \"1. Plan input\",\n    \"tab.privacy\": \"2. De-identify\",\n    \"tab.optimise\": \"3. Filter and optimise\",\n    \"tab.explain\": \"4. Explain and confirm\",\n    \"input.caption\": \"Nothing is stored until you confirm, and even then it stays in this session.\",\n    \"input.start\": \"Start date\",\n    \"input.end\": \"End date\",\n    \"input.day_start\": \"Day starts\",\n    \"input.day_end\": \"Day ends\",\n    \"input.budget\": \"Group budget\",\n    \"input.currency\": \"Currency\",\n    \"fx.title\": \"Exchange suggestion\",\n    \"fx.line\": \"{entered} ≈ {converted}\",\n    \"fx.used_for_planning\": \"Planning uses {planning}. Venue prices and fares are Singapore dollars, so this converted ,\n    \"mode.walk\": \"步行\",\n    \"mode.transit\": \"公共交通\",\n    \"mode.ride_hail\": \"网约车\",\n    \"pace.slow\": \"慢\",\n    \"pace.moderate\": \"适中\",\n    \"pace.fast\": \"快\",\n    \"diet.halal\": \"清真\",\n    \"diet.vegetarian\": \"素食\",\n    \"diet.vegan\": \"纯素\",\n    \"diet.no_pork\": \"不含猪肉\",\n    \"diet.alcohol_free\": \"无酒精\",\n    \"access.wheelchair\": \"轮椅\",\n    \"access.step_free\": \"无台阶\",\n    \"interest.nature\": \"自然\",\n    \"interest.culture\": \"文化\",\n    \"interest.food\": \"美食\",\n    \"interest.shopping\": \"购物\",\n    \"interest.nightlife\": \"夜生活\",\n    \"interest.adventure\": \"探险\",\n    \"interest.relaxation\": \"休闲\",\n    \"feature.preference_match\": \"偏好匹配\",\n    \"feature.travel_time\": \"行程时间\",\n    \"feature.cost\": \"费用\",\n    \"feature.crowd\": \"拥挤程度\",\n    \"kind.FIXED\": \"固定\",\n    \"kind.FLEXIBLE\": \"灵活\",\n    \"weather.forecast\": \"示例天气\",\n    \"weather.heavy_rain\": \"大雨\",\n    \"wx.partly_cloudy\": \"多云\",\n    \"wx.showers\": \"可能有阵雨\",\n    \"wx.warm\": \"温暖\",\n    \"risk.moderate\": \"中等\",\n    \"risk.higher\": \"较高\",\n    \"risk.low\": \"较低\",\n    \"wx.source\": \"示例数据，不是实时 NEA 预报\",\n    \"area.Marina Bay area\": \"滨海湾一带\",\n    \"area.Chinatown area\": \"牛车水一带\",\n    \"area.Kampong Glam area\": \"甘榜格南一带\",\n    \"area.Novena area\": \"诺维娜一带\",\n    \"area.Orchard area\": \"乌节路一带\",\n    \"catalogue.source\": \"离线示例目录（不是实时的 OneMap、陆路交通管理局或 data.gov.sg 数据）\",\n    \"wording.template\": \"模板\",\n    \"wording.model\": \"模型\",\n    \"feedback.off\": \"个性化未开启，因此这次反馈没有写入偏好档案。\",\n    \"feedback.neutral\": \"中性评分不会改变偏好档案。\",\n    \"feedback.updated\": \"只更新了这位同行者自己的偏好向量，使用的是简单移动平均。\",\n    \"model.consent_off\": \"未同意使用 AI，解释仍使用本地模板。\",\n    \"model.no_key\": \"没有设置 LLM_API_KEY 或 OPENAI_API_KEY。解释仍使用本地模板。\",\n    \"model.failed\": \"模型调用失败。解释仍使用本地模板。\",\n    \"model.schema\": \"模型回复不符合固定的解释 JSON 格式，已拒绝。\",\n    \"model.unfaithful\": \"有些模型句子没有指向真正的最大因素，已丢弃：{ids}\",\n    \"model.output_object\": \"模型输出不是 JSON 对象，已拒绝。\",\n    \"model.output_link\": \"模型输出里有链接，已拒绝。\",\n    \"model.output_email\": \"模型输出里有邮箱地址，已拒绝。\",\n    \"model.output_identifier\": \"模型输出里有原始身份信息，已拒绝。\",\n    \"model.output_echo\": \"模型输出复述了原始输入，已拒绝。\",\n    \"explain.why\": \"{prefix}{name}被选中，是因为归一化小组分数里贡献最大的是{factor}。各项贡献：{parts}。\",\n    \"explain.why_missing\": \"{prefix}{name}已排入，但评分特征都缺失，因此无法引用贡献。\",\n    \"explain.prefix.timed\": \"{name}是固定必去，并保持在要求的时间。\",\n    \"explain.prefix.must\": \"{name}是必去锚点，所以路线会保留它。\",\n    \"explain.omitted\": \"以下项目未知，已省略而不是猜测：{names}。\",\n    \"explain.why_not.none\": \"没有剩下可比较的替代地点。\",\n    \"explain.reversal.none\": \"没有替代地点可以用来颠倒排序。\",\n    \"explain.why_not.blocked\": \"{alt}不能占用这个时段：{reason}。这是评分前的硬性约束，准则权重和约定权重都不能把它加回来。说明不会把这条约束安到某一位具名的同行者身上。\",\n    \"explain.reversal.blocked\": \"任何单一的准则权重改动都不能对调{name}和{alt}，因为替代地点根本没有进入评分集合。\",\n    \"explain.why_not.no_factors\": \"{alt}没有可比较的评分因素。\",\n    \"explain.why_not.higher\": \"{alt}的小组分数更高（{alt_score:.2f}，而所选为 {chosen_score:.2f}）。分数差最大的因素是{factor}（差距 {gap:.2f}）。它没有排入，是因为没有可行的插入能在保持公平下限、时间窗、开放时间、预算和必去锚点的同时提高受罚后的定向越野得分。\",\n    \"explain.reversal.higher\": \"分数排序已经偏向{alt}。要把它排进行程，需要的是可行的时间或预算空档，而不是准则权重。\",\n    \"explain.why_not.lower\": \"{alt}分数更低。分数差最大的因素是{factor}（差距 {gap:.2f}）。\",\n    \"explain.reversal.no_flip\": \"在 0–1 的滑杆范围内，没有任何单一准则权重改动能在重新归一化后让{alt}超过{name}。\",\n    \"explain.reversal.flip\": \"{direction}{factor}权重，从 {old:.2f} 调到 {new:.2f}，其他滑杆不动。重新归一化之后，这是让{alt}在加权小组分数上超过{name}的最小一次滑杆改动。\",\n    \"explain.raise\": \"提高\",\n    \"explain.lower\": \"降低\",\n    \"heuristic.note\": (\n        \"路线搜索是带时间窗的团队定向越野问题的启发式：先贪心插入，再做有限的局部搜索。\"\n        \"目标是在当天时间内收集按成员加权的总分，并服从平均满意度 U_k 的公平下限。\"\n        \"如果直接最大化这些平均值的乘积，行程会缩成很少的几站，所以加权纳什社会福利用作否决和并列时的决胜，而不是插入得分。\"\n        \"日期长短不均会受罚，避免把活动堆在同一天；同一类别连续出现也会受罚，以免两餐紧挨着而旁边还有别的类别能排入。\"\n        \"开放时间或价格未知的地点仍然可以入选并会标明，但启发式会从得分里扣掉一笔不确定成本，避免把缺失值当成完美信息。\"\n        \"这不是精确最优。带时间的固定必去会锁住；灵活必去必须出现在行程某处，但时段可以移动。\"\n    ),\n}\n\n\ndef normalise_lang(lang: str | None) -> str:\n    return \"zh\" if lang == \"zh\" else \"en\"\n\n\ndef t(key: str, lang: str | None = \"en\", **kwargs: object) -> str:\n    \"\"\"Look up a UI string. Chinese falls back to English, then to the key.\"\"\"\n    selected = ZH if normalise_lang(lang) == \"zh\" else EN\n    template = selected.get(key) or EN.get(key) or key\n    if not kwargs:\n        return template\n    return template.format(**kwargs)\n\n\ndef feature_name(feature: str, lang: str | None) -> str:\n    return t(f\"feature.{feature}\", lang)\n\n\ndef catalogue_keys() -> tuple[set[str], set[str]]:\n    return set(EN), set(ZH)\n\n\n_REASON_CODES = {\n    \"it does not meet the group's dietary requirement\": \"diet\",\n    \"it does not meet the group's accessibility requirement\": \"accessibility\",\n    \"it is closed during the trip's days and hours\": \"hours\",\n    \"its known price exceeds the group budget\": \"budget\",\n    \"it is unsuitable in the selected heavy-rain scenario\": \"weather\",\n    \"it was rejected for this plan\": \"rejected\",\n}\n\n\ndef reason_phrase(reason: str, lang: str | None) -> str:\n    code = _REASON_CODES.get(reason, reason if reason in {\n        \"diet\", \"accessibility\", \"hours\", \"budget\", \"weather\", \"rejected\"\n    } else \"\")\n    if code:\n        return t(f\"reason.{code}\", lang)\n    return reason\n\n\ndef floor_text(members: list[Member], utilities: list[float], beta: float, meets: bool, lang: str | None) -> str:\n    if meets:\n        return t(\"floor.met\", lang, beta=beta)\n    lines = [t(\"floor.miss\", lang, beta=beta)]\n    for member, utility in zip(members, utilities):\n        if utility < beta:\n            strong = [t(f\"interest.{name}\", lang) for name, value in member.preferences.items() if value >= 0.4]\n            interests = \", \".join(strong) if strong else t(\"floor.none\", lang)\n            lines.append(t(\"floor.member\", lang, name=member.name, utility=utility, interests=interests))\n    lines.append(t(\"floor.advice\", lang))\n    return \" \".join(lines)\n\n\ndef venue_caption(name: str, aliases: list[str], lang: str | None) -> str:\n    \"\"\"Show a Chinese catalogue alias beside the stored English name when useful.\"\"\"\n    if normalise_lang(lang) != \"zh\":\n        return name\n    for alias in aliases:\n        if any(\"\\u4e00\" <= char <= \"\\u9fff\" for char in alias) and alias not in name:\n            return f\"{name}（{alias}）\"\n    return name\n",
 "triper/links.py": "\"\"\"Imported-link parsing.\n\nThe social or map page is never opened. A local matcher reads the URL path\nand the optional caption, then keeps a hit only when it matches the venue\ncatalogue. Low-confidence hits are returned for the user to confirm.\nNames that do not match, including places invented by a model, are dropped.\n\nA model may propose {name, area, category} from the de-identified path and\ncaption. Its proposals go through the same catalogue match.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom dataclasses import dataclass, field\nfrom urllib.parse import unquote\n\nfrom triper.deidentify import build_llm_payload, sanitise_link\nfrom triper.i18n import t\nfrom triper.llm import (\n    EXTRACT_INSTRUCTIONS,\n    LLMClient,\n    ModelCall,\n    output_rejection,\n    parse_place_response,\n)\nfrom triper.models import LinkImport, TripInput, Venue\n\nCONFIRMED_THRESHOLD = 0.82\nPOSSIBLE_THRESHOLD = 0.55\n\n# Hosts the importer recognises. Matching still uses only the path and caption.\nIMPORT_HOSTS: tuple[str, ...] = (\n    \"xiaohongshu.com\",\n    \"xhslink.com\",\n    \"xhs.cn\",\n    \"douyin.com\",\n    \"tiktok.com\",\n    \"instagram.com\",\n    \"google.com\",\n    \"goo.gl\",\n    \"maps.app.goo.gl\",\n)\n\n_STOPWORDS = {\n    \"the\",\n    \"a\",\n    \"an\",\n    \"at\",\n    \"in\",\n    \"on\",\n    \"of\",\n    \"and\",\n    \"or\",\n    \"to\",\n    \"for\",\n    \"by\",\n    \"with\",\n    \"singapore\",\n    \"sg\",\n    \"night\",\n    \"walk\",\n    \"picnic\",\n    \"my\",\n    \"our\",\n    \"this\",\n    \"that\",\n    \"from\",\n    \"into\",\n    \"around\",\n}\n\n\n@dataclass\nclass PlaceMatch:\n    venue_id: str\n    venue_name: str\n    confidence: float\n    needs_confirmation: bool\n    source: str\n\n\n@dataclass\nclass LinkResolution:\n    matches: list[PlaceMatch]\n    unmatched: list[str]\n    payload: dict\n    model_call: ModelCall\n    notes: list[str] = field(default_factory=list)\n    note_keys: list[str] = field(default_factory=list)\n    model_dropped: list[str] = field(default_factory=list)\n\n\ndef import_host(url: str) -> str:\n    from urllib.parse import urlparse\n\n    host = (urlparse(url).netloc or \"\").lower()\n    if host.startswith(\"www.\"):\n        host = host[4:]\n    return host\n\n\ndef is_supported_import_host(url: str) -> bool:\n    \"\"\"True for Xiaohongshu, Douyin, and the other advertised share hosts.\"\"\"\n    host = import_host(url)\n    return any(host == item or host.endswith(\".\" + item) for item in IMPORT_HOSTS)\n\n\ndef normalise_text(value: str) -> str:\n    text = unquote(value or \"\").lower().replace(\"+\", \" \")\n    text = re.sub(r\"[^a-z0-9\\u4e00-\\u9fff]+\", \" \", text)\n    return re.sub(r\"\\s+\", \" \", text).strip()\n\n\ndef _significant(name: str) -> list[str]:\n    return [token for token in normalise_text(name).split() if token not in _STOPWORDS and len(token) > 1]\n\n\ndef name_score(text: str, name: str) -> float:\n    text_norm = normalise_text(text)\n    name_norm = normalise_text(name)\n    if not text_norm or not name_norm:\n        return 0.0\n    if any(\"\\u4e00\" <= char <= \"\\u9fff\" for char in name_norm):\n        # Chinese names are not space-separated, so a caption can hold the\n        # name inside a longer sentence. Two characters avoids a one-word hit.\n        if len(name_norm) >= 2 and name_norm in text_norm:\n            return 1.0\n        return 0.0\n    padded_text = f\" {text_norm} \"\n    padded_name = f\" {name_norm} \"\n    if padded_name in padded_text:\n        if len(name_norm) >= 4 or \" \" in name_norm:\n            return 1.0\n        return 0.7\n    tokens = set(text_norm.split())\n    significant = _significant(name)\n    if not significant:\n        return 0.0\n    hits = sum(1 for token in significant if token in tokens)\n    if hits == 0:\n        return 0.0\n    recall = hits / len(significant)\n    if recall < 0.5:\n        return recall * 0.5\n    if recall < 1.0:\n        return 0.45 + 0.35 * recall\n    return 0.9\n\n\ndef match_places(text: str, venues: list[Venue]) -> list[PlaceMatch]:\n    found: list[PlaceMatch] = []\n    for venue in venues:\n        score = max(name_score(text, venue.name), *(name_score(text, alias) for alias in venue.aliases))\n        if score < POSSIBLE_THRESHOLD:\n            continue\n        found.append(\n            PlaceMatch(\n                venue_id=venue.id,\n                venue_name=venue.name,\n                confidence=round(score, 3),\n                needs_confirmation=score < CONFIRMED_THRESHOLD,\n                source=\"heuristic\",\n            )\n        )\n    found.sort(key=lambda item: (-item.confidence, item.venue_name))\n    # A clear catalogue hit should not also surface weaker overlaps on the same words.\n    if any(item.confidence >= CONFIRMED_THRESHOLD for item in found):\n        found = [item for item in found if item.confidence >= CONFIRMED_THRESHOLD]\n    if len(found) >= 2 and found[0].confidence - found[1].confidence < 0.08:\n        found[0].needs_confirmation = True\n    return found\n\n\ndef accept_extracted_names(names: list[str], venues: list[Venue], source: str) -> tuple[list[PlaceMatch], list[str]]:\n    \"\"\"Keep extracted names only when the catalogue matcher agrees. Drop the rest.\"\"\"\n    kept: list[PlaceMatch] = []\n    dropped: list[str] = []\n    seen: set[str] = set()\n    for name in names:\n        cleaned = name.strip()\n        if not cleaned:\n            continue\n        matches = match_places(cleaned, venues)\n        if not matches:\n            dropped.append(cleaned)\n            continue\n        best = matches[0]\n        if best.venue_id in seen:\n            continue\n        seen.add(best.venue_id)\n        kept.append(\n            PlaceMatch(\n                venue_id=best.venue_id,\n                venue_name=best.venue_name,\n                confidence=best.confidence,\n                needs_confirmation=best.needs_confirmation or best.confidence < CONFIRMED_THRESHOLD,\n                source=source,\n            )\n        )\n    return kept, dropped\n\n\ndef _forbidden(trip: TripInput) -> list[str]:\n    secrets: list[str] = [trip.abode_address]\n    for member in trip.members:\n        secrets.extend([member.name, member.email, member.booking_ref])\n        secrets.extend(part for part in member.name.split() if len(part) >= 3)\n    return [secret for secret in secrets if secret]\n\n\ndef resolve_links(\n    trip: TripInput,\n    venues: list[Venue],\n    llm: LLMClient | None = None,\n    ai_consent: bool = False,\n) -> LinkResolution:\n    \"\"\"Match every imported link. The model is called only with consent and a key.\"\"\"\n    payload = build_llm_payload(trip, purpose=\"extract_places\")\n    notes: list[str] = []\n    note_keys: list[str] = []\n    model_places: list[dict] = []\n    call = ModelCall(payload=payload, sent=False, accepted=False, rejection=None, body=None)\n    client = llm or LLMClient()\n    if ai_consent and client.available:\n        raw = client.complete_json(payload, EXTRACT_INSTRUCTIONS)\n        call.sent = True\n        if raw is None:\n            call.rejection = \"The model call failed. Local matching was used instead.\"\n            notes.append(call.rejection)\n            note_keys.append(\"link.failed\")\n        else:\n            echoed = [sanitise_link(link, trip.members, trip.abode_address, trip.abode_label)[\"caption\"] for link in trip.links]\n            rejection = output_rejection(raw, _forbidden(trip), echoed)\n            if rejection:\n                call.rejection = t(rejection, \"en\")\n                notes.append(call.rejection)\n                note_keys.append(rejection)\n            else:\n                parsed = parse_place_response(raw)\n                if parsed is None:\n                    call.rejection = \"The model response did not match the fixed place schema and was rejected.\"\n                    notes.append(call.rejection)\n                    note_keys.append(\"link.bad_schema\")\n                else:\n                    call.accepted = True\n                    call.body = {\"places\": parsed}\n                    model_places = parsed\n    elif ai_consent and not client.available:\n        notes.append(\"AI consent is on, but no LLM_API_KEY or OPENAI_API_KEY is set. Local matching was used.\")\n        note_keys.append(\"link.no_key\")\n    else:\n        notes.append(\"No model call. Places were matched locally from the URL path and caption.\")\n        note_keys.append(\"link.local\")\n\n    matches: list[PlaceMatch] = []\n    unmatched: list[str] = []\n    model_dropped: list[str] = []\n    seen: set[str] = set()\n    for link in trip.links:\n        cleaned = sanitise_link(link, trip.members, trip.abode_address, trip.abode_label)\n        text = f\"{cleaned['url_path']} {cleaned['caption']}\".strip()\n        local = match_places(text, venues)\n        if not local:\n            label = text or link.url\n            unmatched.append(label)\n        for item in local:\n            if item.venue_id in seen:\n                continue\n            seen.add(item.venue_id)\n            matches.append(item)\n    if model_places:\n        accepted, dropped = accept_extracted_names([item[\"name\"] for item in model_places], venues, source=\"model\")\n        for name in dropped:\n            model_dropped.append(name)\n            unmatched.append(f\"Model suggested “{name}”, which is not in the venue catalogue and was dropped.\")\n        for item in accepted:\n            if item.venue_id in seen:\n                continue\n            # A model proposal never outranks the need to confirm a weak catalogue hit.\n            item.needs_confirmation = item.needs_confirmation or item.confidence < CONFIRMED_THRESHOLD\n            seen.add(item.venue_id)\n            matches.append(item)\n    matches.sort(key=lambda item: (-item.confidence, item.venue_name))\n    return LinkResolution(\n        matches=matches,\n        unmatched=unmatched,\n        payload=payload,\n        model_call=call,\n        notes=notes,\n        note_keys=note_keys,\n        model_dropped=model_dropped,\n    )\n\n\ndef resolution_from_caption(text: str, venues: list[Venue]) -> tuple[list[PlaceMatch], list[str]]:\n    \"\"\"Helper for tests and the fallback matcher. Does not call a model.\"\"\"\n    matches = match_places(text, venues)\n    if matches:\n        return matches, []\n    return [], [text]\n",
 "triper/llm.py": "\"\"\"Optional pretrained LLM client.\n\nUsed only for unstructured text: place extraction from a link path and\ncaption, and wording of explanations whose factors were already computed.\nTemperature is capped at 0.2. The response must be one fixed JSON object.\nExtra links, files, raw identifiers, or a verbatim echo of the caption are\nrejected and the local fallback is kept.\n\nIf LLM_API_KEY or OPENAI_API_KEY is unset, every call returns None and the\napp stays on the local matcher and the score templates.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\nimport re\nimport urllib.error\nimport urllib.request\nfrom dataclasses import dataclass\n\nEXTRACT_KEYS = (\"name\", \"area\", \"category\", \"confidence\")\nWORD_KEYS = (\"venue_id\", \"why\", \"why_not\", \"reversal\", \"top_factor\")\n\nEXTRACT_INSTRUCTIONS = (\n    \"You extract candidate places from a de-identified URL path and caption. \"\n    \"Return only a JSON object of the form \"\n    '{\"places\":[{\"name\":\"string\",\"area\":\"string\",\"category\":\"string\",\"confidence\":0.0}]}. '\n    \"confidence is between 0 and 1. Do not rank places, do not plan an itinerary, \"\n    \"do not add links or files, and do not repeat names, emails, booking references, \"\n    \"or street addresses. If nothing is a place, return {\\\"places\\\":[]}.\"\n)\n\nWORD_INSTRUCTIONS = (\n    \"You rephrase explanations that were already computed. Return only a JSON object \"\n    '{\"stops\":[{\"venue_id\":\"string\",\"why\":\"string\",\"why_not\":\"string\",\"reversal\":\"string\",\"top_factor\":\"string\"}]}. '\n    \"Copy venue_id and top_factor exactly. The why sentence must name that same top factor. \"\n    \"Do not change which venue was chosen, do not invent scores, do not add links, \"\n    \"and do not mention a named person's diet, mobility, email, or address. \"\n    \"Use group wording such as \\\"the group's accessibility requirement\\\".\"\n)\n\n\ndef word_instructions(lang: str = \"en\") -> str:\n    \"\"\"Ask the model to word explanations in the current interface language.\"\"\"\n    if lang == \"zh\":\n        return (\n            WORD_INSTRUCTIONS\n            + \" Write why, why_not, and reversal in Simplified Chinese. \"\n            + \"The why sentence must include the Chinese name of the top factor \"\n            + \"(偏好匹配, 行程时间, 费用, or 拥挤程度). Leave top_factor as the English code.\"\n        )\n    return WORD_INSTRUCTIONS + \" Write why, why_not, and reversal in English.\"\n\n_LINK_RE = re.compile(r\"https?://|www\\.\", re.IGNORECASE)\n_EMAIL_RE = re.compile(r\"[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}\", re.IGNORECASE)\n\n\n@dataclass\nclass ModelCall:\n    payload: dict\n    sent: bool\n    accepted: bool\n    rejection: str | None = None\n    body: dict | None = None\n\n\nclass LLMClient:\n    def __init__(\n        self,\n        api_key: str | None = None,\n        base_url: str | None = None,\n        model: str | None = None,\n        temperature: float | None = None,\n    ) -> None:\n        if api_key is None:\n            api_key = os.environ.get(\"LLM_API_KEY\") or os.environ.get(\"OPENAI_API_KEY\") or \"\"\n        self.api_key = api_key\n        self.base_url = (base_url or os.environ.get(\"LLM_BASE_URL\") or \"https://api.openai.com/v1\").rstrip(\"/\")\n        self.model = model or os.environ.get(\"LLM_MODEL\") or \"gpt-4o-mini\"\n        requested = temperature if temperature is not None else float(os.environ.get(\"LLM_TEMPERATURE\", \"0.2\"))\n        # Low temperature is part of the containment design, not a tunable default.\n        self.temperature = min(0.2, max(0.0, float(requested)))\n\n    @property\n    def available(self) -> bool:\n        return bool(self.api_key)\n\n    def complete_json(self, payload: dict, instructions: str) -> dict | None:\n        if not self.available:\n            return None\n        body = {\n            \"model\": self.model,\n            \"temperature\": self.temperature,\n            \"response_format\": {\"type\": \"json_object\"},\n            \"messages\": [\n                {\"role\": \"system\", \"content\": instructions},\n                {\"role\": \"user\", \"content\": json.dumps(payload, ensure_ascii=False)},\n            ],\n        }\n        request = urllib.request.Request(\n            f\"{self.base_url}/chat/completions\",\n            data=json.dumps(body).encode(\"utf-8\"),\n            headers={\n                \"Authorization\": f\"Bearer {self.api_key}\",\n                \"Content-Type\": \"application/json\",\n            },\n            method=\"POST\",\n        )\n        try:\n            with urllib.request.urlopen(request, timeout=30) as response:\n                raw = json.loads(response.read().decode(\"utf-8\"))\n            content = raw[\"choices\"][0][\"message\"][\"content\"]\n            parsed = json.loads(content)\n        except Exception:  # noqa: BLE001 - offline, Pyodide (no sockets), or bad payload all fall back\n            return None\n        if not isinstance(parsed, dict):\n            return None\n        return parsed\n\n\ndef output_rejection(obj: object, forbidden: list[str], echoed: list[str] | None = None) -> str | None:\n    \"\"\"Return a reason to discard model output, or None when it may be parsed.\"\"\"\n    if not isinstance(obj, dict):\n        return \"model.output_object\"\n    blob = json.dumps(obj, ensure_ascii=False)\n    if _LINK_RE.search(blob):\n        return \"model.output_link\"\n    if _EMAIL_RE.search(blob):\n        return \"model.output_email\"\n    lowered = blob.lower()\n    for secret in forbidden:\n        if secret and len(secret) >= 3 and secret.lower() in lowered:\n            return \"model.output_identifier\"\n    for phrase in echoed or []:\n        compact = (phrase or \"\").strip()\n        if len(compact) >= 24 and compact.lower() in lowered:\n            return \"model.output_echo\"\n    return None\n\n\ndef parse_place_response(obj: dict) -> list[dict] | None:\n    if set(obj) != {\"places\"} or not isinstance(obj[\"places\"], list):\n        return None\n    places: list[dict] = []\n    for item in obj[\"places\"]:\n        if not isinstance(item, dict) or set(item) != set(EXTRACT_KEYS):\n            return None\n        if not all(isinstance(item[key], str) for key in (\"name\", \"area\", \"category\")):\n            return None\n        confidence = item[\"confidence\"]\n        if isinstance(confidence, bool) or not isinstance(confidence, (int, float)):\n            return None\n        if not 0.0 <= float(confidence) <= 1.0:\n            return None\n        places.append(\n            {\n                \"name\": item[\"name\"].strip(),\n                \"area\": item[\"area\"].strip(),\n                \"category\": item[\"category\"].strip(),\n                \"confidence\": float(confidence),\n            }\n        )\n    return places\n\n\ndef parse_wording_response(obj: dict) -> list[dict] | None:\n    if set(obj) != {\"stops\"} or not isinstance(obj[\"stops\"], list):\n        return None\n    stops: list[dict] = []\n    for item in obj[\"stops\"]:\n        if not isinstance(item, dict) or set(item) != set(WORD_KEYS):\n            return None\n        if not all(isinstance(item[key], str) and item[key].strip() for key in WORD_KEYS):\n            return None\n        stops.append({key: item[key].strip() for key in WORD_KEYS})\n    return stops\n",
 "triper/models.py": "\"\"\"Shared records for a Triper trip.\n\nPersonal fields (name, email, booking reference, precise abode address,\ndiet, accessibility) stay inside the session. Only an allowlisted,\nde-identified payload may be offered to an external model.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom datetime import date, timedelta\n\nINTERESTS: tuple[str, ...] = (\n    \"nature\",\n    \"culture\",\n    \"food\",\n    \"shopping\",\n    \"nightlife\",\n    \"adventure\",\n    \"relaxation\",\n)\n\n# Higher is better after normalisation. These are the only scoring features.\nFEATURES: tuple[str, ...] = (\n    \"preference_match\",\n    \"travel_time\",\n    \"cost\",\n    \"crowd\",\n)\n\nPACES: tuple[str, ...] = (\"slow\", \"moderate\", \"fast\")\nDIETS: tuple[str, ...] = (\"halal\", \"vegetarian\", \"vegan\", \"no_pork\", \"alcohol_free\")\nACCESS_NEEDS: tuple[str, ...] = (\"wheelchair\", \"step_free\")\nTRANSPORT_MODES: tuple[str, ...] = (\"walk\", \"transit\", \"ride_hail\")\nWEEKDAYS: tuple[str, ...] = (\"mon\", \"tue\", \"wed\", \"thu\", \"fri\", \"sat\", \"sun\")\n\nFEATURE_LABELS: dict[str, str] = {\n    \"preference_match\": \"preference match\",\n    \"travel_time\": \"travel time\",\n    \"cost\": \"cost\",\n    \"crowd\": \"crowd\",\n}\n\n\ndef parse_hm(value: str) -> int:\n    \"\"\"Convert HH:MM to minutes after midnight.\"\"\"\n    hour, minute = value.strip().split(\":\")\n    return int(hour) * 60 + int(minute)\n\n\ndef format_hm(minutes: int) -> str:\n    minutes = int(minutes)\n    return f\"{minutes // 60:02d}:{minutes % 60:02d}\"\n\n\ndef weekday_key(day: date) -> str:\n    return WEEKDAYS[day.weekday()]\n\n\ndef each_date(start_iso: str, end_iso: str) -> list[date]:\n    start = date.fromisoformat(start_iso)\n    end = date.fromisoformat(end_iso)\n    if end < start:\n        raise ValueError(\"Trip end date is before the start date.\")\n    days: list[date] = []\n    cursor = start\n    while cursor <= end:\n        days.append(cursor)\n        cursor += timedelta(days=1)\n    return days\n\n\ndef blank_preferences() -> dict[str, float]:\n    return {key: 0.0 for key in INTERESTS}\n\n\n@dataclass\nclass Venue:\n    \"\"\"A catalogue place. Prices, hours, and crowd levels may be unknown.\n\n    Unknown opening hours and prices are stored as None and must not be\n    imputed. Crowd figures are estimates, never live counts.\n    \"\"\"\n\n    id: str\n    name: str\n    aliases: list[str]\n    area: str\n    lat: float\n    lon: float\n    category: str\n    tags: dict[str, float]\n    duration_min: int\n    price_per_person_sgd: float | None\n    hours: dict[str, tuple[int, int] | None] | None\n    diets_supported: set[str]\n    serves_food: bool\n    wheelchair_accessible: bool\n    step_free: bool\n    crowd_estimate: float\n    indoor: bool\n    weather_sensitive: bool\n    source: str\n    last_updated: str\n    notes: str = \"\"\n\n    @property\n    def hours_known(self) -> bool:\n        return self.hours is not None\n\n    @property\n    def price_known(self) -> bool:\n        return self.price_per_person_sgd is not None\n\n\n@dataclass\nclass Member:\n    id: str\n    name: str\n    email: str = \"\"\n    booking_ref: str = \"\"\n    preferences: dict[str, float] = field(default_factory=blank_preferences)\n    pace: str = \"moderate\"\n    crowd_tolerance: float = 0.5\n    diets: list[str] = field(default_factory=list)\n    accessibility: list[str] = field(default_factory=list)\n    weight: float = 1.0\n    update_count: int = 0\n\n\n@dataclass\nclass MustVisit:\n    venue_id: str\n    kind: str  # FIXED or FLEXIBLE\n    on_date: str | None = None\n    at_time: str | None = None\n\n\n@dataclass\nclass LinkImport:\n    url: str\n    caption: str = \"\"\n\n\n@dataclass\nclass TripInput:\n    start_date: str\n    end_date: str\n    day_start: str\n    day_end: str\n    budget_sgd: float\n    transport_modes: list[str]\n    abode_label: str\n    abode_address: str\n    abode_lat: float\n    abode_lon: float\n    members: list[Member]\n    must_visits: list[MustVisit] = field(default_factory=list)\n    budget_currency: str = \"SGD\"\n    # SGD per 1 unit of budget_currency, locked from the suggestion on screen.\n    # None uses the offline table. The pipeline does not fetch a rate itself.\n    fx_sgd_per_unit: float | None = None\n    links: list[LinkImport] = field(default_factory=list)\n    alphas: dict[str, float] = field(default_factory=dict)\n    beta: float = 0.5\n    weather_scenario: str = \"forecast\"\n    delay_minutes: int = 0\n    delay_date: str | None = None\n    excluded_venue_ids: list[str] = field(default_factory=list)\n\n    def dates(self) -> list[date]:\n        return each_date(self.start_date, self.end_date)\n",
 "triper/money.py": "\"\"\"Currency conversion for a Singapore trip.\n\nCatalogue prices and fares are Singapore dollars. The number someone types\nis converted into SGD before the budget ceiling, cost checks, or fairness\nmath. A live ECB reference rate is optional. The offline table is always\navailable and is what the planner uses unless a rate has been locked from\nthe suggestion the user just saw.\n\nNo personal data is sent. A live request contains only a currency pair.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport urllib.error\nimport urllib.request\nfrom dataclasses import dataclass\n\nCURRENCIES: tuple[str, ...] = (\"SGD\", \"CNY\", \"USD\", \"EUR\", \"MYR\", \"HKD\", \"JPY\", \"THB\", \"GBP\")\nDESTINATION = \"SGD\"\nREFERENCE = \"CNY\"\n\n# Units of foreign currency per 1 SGD. ECB reference via Frankfurter, 2026-11-06.\n# Stored so the app still converts with no network. Not a bank or card rate.\nFALLBACK_PER_SGD: dict[str, float] = {\n    \"SGD\": 1.0,\n    \"CNY\": 5.2055,\n    \"USD\": 0.78028,\n    \"EUR\": 0.69886,\n    \"MYR\": 3.1672,\n    \"HKD\": 6.1154,\n    \"JPY\": 123.54,\n    \"THB\": 26.179,\n    \"GBP\": 0.58295,\n}\nFALLBACK_AS_OF = \"2026-11-06\"\nFALLBACK_PROVIDER = \"Stored ECB snapshot (Frankfurter), 2026-11-06\"\nLIVE_PROVIDER = \"Frankfurter, ECB reference\"\nLIVE_URL = \"https://api.frankfurter.app/latest?from={base}&to={quote}\"\n\n\n@dataclass(frozen=True)\nclass RateQuote:\n    base: str\n    quote: str\n    rate: float\n    source: str  # live or fallback\n    as_of: str\n    provider: str\n\n    @property\n    def sgd_per_unit(self) -> float:\n        \"\"\"SGD received for 1 unit of `base`, when `quote` is SGD.\"\"\"\n        if self.quote != DESTINATION:\n            raise ValueError(\"sgd_per_unit is only defined for a quote in SGD.\")\n        return self.rate\n\n\n@dataclass(frozen=True)\nclass ExchangeSuggestion:\n    entered_amount: float\n    entered_currency: str\n    converted_amount: float\n    converted_currency: str\n    planning_sgd: float\n    sgd_per_unit: float\n    rate_base: str\n    rate_quote: str\n    rate_value: float\n    source: str\n    as_of: str\n    provider: str\n\n\nclass UnknownCurrency(ValueError):\n    pass\n\n\ndef _check(currency: str) -> str:\n    code = (currency or \"\").upper()\n    if code not in FALLBACK_PER_SGD:\n        raise UnknownCurrency(code)\n    return code\n\n\ndef fallback_quote(base: str, quote: str) -> RateQuote:\n    \"\"\"Offline cross rate. `rate` is units of `quote` per 1 `base`.\"\"\"\n    base = _check(base)\n    quote = _check(quote)\n    if base == quote:\n        rate = 1.0\n    else:\n        # FALLBACK is units of that currency per 1 SGD.\n        # quote per 1 base = (quote per SGD) / (base per SGD).\n        rate = FALLBACK_PER_SGD[quote] / FALLBACK_PER_SGD[base]\n    return RateQuote(base, quote, rate, \"fallback\", FALLBACK_AS_OF, FALLBACK_PROVIDER)\n\n\ndef sgd_per_unit_fallback(currency: str) -> float:\n    currency = _check(currency)\n    return 1.0 / FALLBACK_PER_SGD[currency]\n\n\ndef _fetch_live(base: str, quote: str, timeout: float = 2.5) -> RateQuote | None:\n    if base == quote:\n        return RateQuote(base, quote, 1.0, \"live\", FALLBACK_AS_OF, LIVE_PROVIDER)\n    url = LIVE_URL.format(base=base, quote=quote)\n    request = urllib.request.Request(url, headers={\"Accept\": \"application/json\"}, method=\"GET\")\n    try:\n        with urllib.request.urlopen(request, timeout=timeout) as response:\n            payload = json.loads(response.read().decode(\"utf-8\"))\n        rate = float(payload[\"rates\"][quote])\n        as_of = str(payload.get(\"date\") or \"\")\n    except Exception:  # noqa: BLE001 - offline, Pyodide (no sockets), or bad payload all fall back\n        return None\n    if rate <= 0:\n        return None\n    return RateQuote(base, quote, rate, \"live\", as_of, LIVE_PROVIDER)\n\n\ndef quote_pair(\n    base: str,\n    quote: str,\n    *,\n    allow_network: bool = False,\n    cache: dict | None = None,\n    locked_sgd_per_unit: float | None = None,\n) -> RateQuote:\n    \"\"\"Rate as units of `quote` per 1 `base`.\n\n    `locked_sgd_per_unit` applies only when converting that currency into SGD.\n    The planner passes it so scoring uses the same figure the suggestion showed.\n    \"\"\"\n    base = _check(base)\n    quote = _check(quote)\n    if locked_sgd_per_unit is not None and locked_sgd_per_unit > 0 and quote == DESTINATION:\n        rate = locked_sgd_per_unit if base != DESTINATION else 1.0\n        if base == DESTINATION:\n            rate = 1.0\n        return RateQuote(base, quote, rate, \"locked\", FALLBACK_AS_OF, \"Rate shown with the budget\")\n    key = (base, quote, \"live\" if allow_network else \"fallback\")\n    if cache is not None and key in cache:\n        return cache[key]\n    found: RateQuote | None = None\n    if allow_network:\n        found = _fetch_live(base, quote)\n    if found is None:\n        found = fallback_quote(base, quote)\n    if cache is not None:\n        cache[key] = found\n    return found\n\n\ndef planning_budget_sgd(trip) -> float:\n    \"\"\"SGD ceiling used by filters, fares, scores, and fairness.\n\n    `trip.budget_sgd` is the number that was typed. It is not assumed to be\n    Singapore dollars unless `budget_currency` is SGD.\n    \"\"\"\n    currency = _check(getattr(trip, \"budget_currency\", None) or DESTINATION)\n    amount = float(trip.budget_sgd)\n    locked = getattr(trip, \"fx_sgd_per_unit\", None)\n    if currency == DESTINATION:\n        return amount\n    if locked is not None and float(locked) > 0:\n        return amount * float(locked)\n    return amount * sgd_per_unit_fallback(currency)\n\n\ndef exchange_suggestion(\n    amount: float,\n    currency: str,\n    *,\n    allow_network: bool = False,\n    cache: dict | None = None,\n) -> ExchangeSuggestion:\n    \"\"\"Planning hint. SGD input is also shown in CNY so the line is never blank.\"\"\"\n    currency = _check(currency)\n    amount = float(amount)\n    into_sgd = quote_pair(currency, DESTINATION, allow_network=allow_network, cache=cache)\n    planning = amount * into_sgd.rate\n    if currency == DESTINATION:\n        reference = quote_pair(DESTINATION, REFERENCE, allow_network=allow_network, cache=cache)\n        return ExchangeSuggestion(\n            entered_amount=amount,\n            entered_currency=currency,\n            converted_amount=amount * reference.rate,\n            converted_currency=REFERENCE,\n            planning_sgd=amount,\n            sgd_per_unit=1.0,\n            rate_base=reference.base,\n            rate_quote=reference.quote,\n            rate_value=reference.rate,\n            source=reference.source,\n            as_of=reference.as_of,\n            provider=reference.provider,\n        )\n    return ExchangeSuggestion(\n        entered_amount=amount,\n        entered_currency=currency,\n        converted_amount=planning,\n        converted_currency=DESTINATION,\n        planning_sgd=planning,\n        sgd_per_unit=into_sgd.rate,\n        rate_base=into_sgd.base,\n        rate_quote=into_sgd.quote,\n        rate_value=into_sgd.rate,\n        source=into_sgd.source,\n        as_of=into_sgd.as_of,\n        provider=into_sgd.provider,\n    )\n\n\ndef format_money(amount: float, currency: str) -> str:\n    currency = _check(currency)\n    if currency == \"JPY\":\n        return f\"{amount:,.0f} {currency}\"\n    return f\"{amount:,.2f} {currency}\"\n\n\ndef format_rate(value: float) -> str:\n    if value >= 100:\n        return f\"{value:,.2f}\"\n    if value >= 1:\n        return f\"{value:,.4f}\"\n    return f\"{value:.6f}\"\n",
 "triper/pipeline.py": "\"\"\"Plan a trip locally, then optionally ask a model to rephrase.\n\nOrder of work: de-identify (payload preview only), hard-constraint filter,\nweighted scores, weighted NSW, orienteering heuristic, explanations from\nthose scores. The model is not on this path unless the caller asks it to\nrephrase, and even then it cannot change the venue order.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, replace\nfrom datetime import date\n\nfrom triper.constraints import FilterResult, drop_reason_text, filter_venues\nfrom triper.deidentify import PayloadRejected, assign_pseudonyms, build_llm_payload\nfrom triper.explain import Explanation, _group, apply_model_wording, explain_pair, member_weights\nfrom triper.i18n import t\nfrom triper.geo import estimate_leg\nfrom triper.llm import LLMClient, ModelCall, output_rejection, parse_wording_response, word_instructions\nfrom triper.models import FEATURES, Member, TripInput, Venue\nfrom triper.money import planning_budget_sgd\nfrom triper.preferences import moving_average_update\nfrom triper.routing import HEURISTIC_NOTE, RouteResult, optimise, pacing_variance_hours, travel_detour_ratio\nfrom triper.scoring import feature_vector, normalise_alphas, preference_match\nfrom triper.venues import load_venues\n\nHARD_REASONS = (\"diet\", \"accessibility\", \"hours\", \"budget\", \"weather\")\n\n\n@dataclass\nclass PlanResult:\n    weights: list[float]\n    beta: float\n    normalised_alphas: dict[str, float]\n    route: RouteResult\n    explanations: list[Explanation]\n    filtered: FilterResult\n    metrics: dict[str, float | int | None]\n    floor_message: str\n    payload_preview: dict | None\n    payload_error: str | None\n    meets_floor: bool\n    pseudonyms: dict[str, str]\n    constraint_notes: list[str] | None = None\n    heuristic_note: str = HEURISTIC_NOTE\n\n\ndef illustrative_forecast(day: date) -> dict[str, str]:\n    \"\"\"A labelled stand-in, not a live NEA forecast.\"\"\"\n    if day.weekday() >= 5:\n        condition, risk = \"Partly cloudy\", \"moderate\"\n    elif day.weekday() in (1, 4):\n        condition, risk = \"Showers possible\", \"higher\"\n    else:\n        condition, risk = \"Warm\", \"low\"\n    return {\n        \"date\": day.isoformat(),\n        \"condition\": condition,\n        \"rain_risk\": risk,\n        \"source\": \"Illustrative sample, not a live NEA forecast\",\n        \"as_of\": \"2026-09-01\",\n    }\n\n\ndef default_alphas() -> dict[str, float]:\n    \"\"\"Starting sliders. Scoring renormalises them. Not a claim of a tuned optimum.\"\"\"\n    return {\n        \"preference_match\": 0.40,\n        \"travel_time\": 0.25,\n        \"cost\": 0.25,\n        \"crowd\": 0.10,\n    }\n\n\ndef _mean_preference(members: list[Member], venue: Venue) -> float:\n    if not members:\n        return 0.0\n    return sum(preference_match(member, venue) for member in members) / len(members)\n\n\ndef _feature_rows(members: list[Member], venue: Venue, travel_min: float) -> list[dict[str, float | None]]:\n    return [feature_vector(member, venue, travel_min) for member in members]\n\n\ndef constraint_notes(filtered: FilterResult, catalogue: dict[str, Venue], members: list[Member]) -> list[str]:\n    \"\"\"One line per hard-filtered venue the group would otherwise have liked.\n\n    Shown once for the plan. Explanations do not attach the constraint to a person.\n    \"\"\"\n    notes: list[str] = []\n    for dropped in filtered.dropped:\n        reason = next((item for item in dropped.reasons if item in HARD_REASONS), None)\n        venue = catalogue.get(dropped.venue_id)\n        if reason is None or venue is None:\n            continue\n        if _mean_preference(members, venue) < 0.30:\n            continue\n        notes.append(\n            f\"{venue.name} was removed before scoring: {drop_reason_text(reason)}. \"\n            \"Criterion weights cannot override that, and the note is not tied to one traveller.\"\n        )\n    return notes\n\n\ndef _explanations(\n    trip: TripInput,\n    route: RouteResult,\n    filtered: FilterResult,\n    catalogue: dict[str, Venue],\n) -> list[Explanation]:\n    members = trip.members\n    weights = member_weights(members)\n    party = max(1, len(members))\n    kept = {item.venue.id: item.venue for item in filtered.kept}\n    used = {stop.venue_id for day in route.days for stop in day.stops}\n    explanations: list[Explanation] = []\n    for day in route.days:\n        origin_lat, origin_lon = trip.abode_lat, trip.abode_lon\n        for stop in day.stops:\n            venue = kept.get(stop.venue_id) or catalogue.get(stop.venue_id)\n            if venue is None:\n                continue\n            chosen_rows = _feature_rows(members, venue, stop.travel_min)\n            alternative_id = None\n            alternative_name = None\n            alternative_rows = None\n            best_score = None\n            for other in kept.values():\n                if other.id in used:\n                    continue\n                leg = estimate_leg(\n                    origin_lat,\n                    origin_lon,\n                    other.lat,\n                    other.lon,\n                    trip.transport_modes,\n                    party,\n                    remaining_budget=None,\n                )\n                travel = float(leg.minutes) if leg else 90.0\n                rows = _feature_rows(members, other, travel)\n                score, _, _ = _group(rows, weights, trip.alphas)\n                if best_score is None or score > best_score:\n                    best_score = score\n                    alternative_id = other.id\n                    alternative_name = other.name\n                    alternative_rows = rows\n            explanation = explain_pair(\n                venue.id,\n                venue.name,\n                chosen_rows,\n                weights,\n                trip.alphas,\n                alternative_id,\n                alternative_name,\n                alternative_rows,\n                anchor_role=stop.role,\n            )\n            explanations.append(explanation)\n            origin_lat, origin_lon = venue.lat, venue.lon\n    return explanations\n\n\ndef _floor_message(members: list[Member], utilities: list[float], beta: float, meets: bool) -> str:\n    if meets:\n        return (\n            f\"Every member is at or above the fairness floor of {beta:.2f}. \"\n            \"Agreed weightage was not changed.\"\n        )\n    lines = [f\"No feasible plan kept every member at or above the fairness floor of {beta:.2f}.\"]\n    for member, utility in zip(members, utilities):\n        if utility < beta:\n            strong = [name for name, value in member.preferences.items() if value >= 0.4]\n            interests = \", \".join(strong) if strong else \"no interest at or above 0.4\"\n            lines.append(f\"{member.name} is at {utility:.2f}. Their stronger stated interests are {interests}.\")\n    lines.append(\n        \"Agreed weightage was not rewritten. Lower the floor, move the criterion weights, \"\n        \"or change a must-visit, then optimise again.\"\n    )\n    return \" \".join(lines)\n\n\ndef _metrics(trip: TripInput, route: RouteResult, filtered: FilterResult, catalogue: dict[str, Venue]) -> dict:\n    scheduled = [stop.venue_id for day in route.days for stop in day.stops]\n    dropped_ids = {item.venue_id for item in filtered.dropped}\n    violations = [venue_id for venue_id in scheduled if venue_id in dropped_ids]\n    included = [must for must in trip.must_visits if must.venue_id in scheduled]\n    blocked = [must for must in trip.must_visits if must.venue_id in dropped_ids]\n    lowest = min(route.utilities) if route.utilities else 0.0\n    highest = max(route.utilities) if route.utilities else 0.0\n    log_value = route.plan.nsw_log\n    return {\n        \"hard_constraint_violations\": len(violations),\n        \"locked_in_requested\": len(trip.must_visits),\n        \"locked_in_included\": len(included),\n        \"locked_in_blocked\": len(blocked),\n        \"detour_ratio\": travel_detour_ratio(trip, route.days, catalogue),\n        \"pacing_variance_hours\": round(pacing_variance_hours(route.days), 4),\n        \"lowest_satisfaction\": round(lowest, 4),\n        \"satisfaction_gap\": round(highest - lowest, 4),\n        \"nsw_product\": route.plan.nsw_product,\n        \"nsw_log\": None if log_value != log_value or log_value == float(\"-inf\") else log_value,\n        \"known_cost_sgd\": route.total_known_cost,\n        \"budget_sgd\": planning_budget_sgd(trip),\n        \"budget_entered\": trip.budget_sgd,\n        \"budget_currency\": (trip.budget_currency or \"SGD\").upper(),\n    }\n\n\ndef plan_trip(trip: TripInput, venues: list[Venue] | None = None) -> PlanResult:\n    catalogue_list = list(venues) if venues is not None else load_venues()\n    catalogue = {venue.id: venue for venue in catalogue_list}\n    filtered = filter_venues(catalogue_list, trip)\n    kept = [item.venue for item in filtered.kept]\n    dropped_details = {item.venue_id: item.detail for item in filtered.dropped}\n    route = optimise(trip, kept, catalogue, dropped_details)\n    explanations = _explanations(trip, route, filtered, catalogue)\n    meets = route.plan.meets_floor\n    try:\n        payload: dict | None = build_llm_payload(trip, purpose=\"extract_places\")\n        payload_error = None\n    except PayloadRejected as exc:\n        payload = None\n        payload_error = str(exc)\n    return PlanResult(\n        weights=[float(member.weight) for member in trip.members],\n        beta=trip.beta,\n        normalised_alphas=normalise_alphas(trip.alphas),\n        route=route,\n        explanations=explanations,\n        filtered=filtered,\n        metrics=_metrics(trip, route, filtered, catalogue),\n        floor_message=_floor_message(trip.members, route.utilities, trip.beta, meets),\n        payload_preview=payload,\n        payload_error=payload_error,\n        meets_floor=meets,\n        pseudonyms=assign_pseudonyms(trip.members),\n        constraint_notes=constraint_notes(filtered, catalogue, trip.members),\n    )\n\n\ndef score_facts(explanations: list[Explanation]) -> dict:\n    \"\"\"De-identified facts for wording. No member names or sensitive constraints.\"\"\"\n    return {\n        \"stops\": [\n            {\n                \"venue_id\": item.venue_id,\n                \"venue_name\": item.venue_name,\n                \"top_factor\": item.top_factor,\n                \"contributions\": item.contributions,\n                \"alternative_name\": item.alternative_name or \"\",\n                \"gap_factor\": item.gap_factor or \"\",\n                \"reversal\": item.reversal,\n            }\n            for item in explanations\n        ]\n    }\n\n\ndef rephrase_explanations(\n    trip: TripInput,\n    explanations: list[Explanation],\n    llm: LLMClient | None = None,\n    ai_consent: bool = False,\n    lang: str = \"en\",\n) -> tuple[list[Explanation], ModelCall]:\n    \"\"\"Ask the model to word existing explanations. Reject anything unfaithful.\"\"\"\n    client = llm or LLMClient()\n    try:\n        payload = build_llm_payload(\n            trip,\n            purpose=\"word_explanations\",\n            score_facts=score_facts(explanations),\n            links=[],\n        )\n    except PayloadRejected as exc:\n        return explanations, ModelCall(payload={}, sent=False, accepted=False, rejection=t(\"privacy.refused\", lang))\n    if not ai_consent:\n        return explanations, ModelCall(\n            payload=payload,\n            sent=False,\n            accepted=False,\n            rejection=t(\"model.consent_off\", lang),\n        )\n    if not client.available:\n        return explanations, ModelCall(\n            payload=payload,\n            sent=False,\n            accepted=False,\n            rejection=t(\"model.no_key\", lang),\n        )\n    raw = client.complete_json(payload, word_instructions(lang))\n    if raw is None:\n        return explanations, ModelCall(\n            payload=payload,\n            sent=True,\n            accepted=False,\n            rejection=t(\"model.failed\", lang),\n        )\n    secrets: list[str] = [trip.abode_address]\n    for member in trip.members:\n        secrets.extend([member.name, member.email, member.booking_ref])\n    rejection = output_rejection(raw, secrets)\n    if rejection:\n        return explanations, ModelCall(payload=payload, sent=True, accepted=False, rejection=t(rejection, lang))\n    parsed = parse_wording_response(raw)\n    if parsed is None:\n        return explanations, ModelCall(\n            payload=payload,\n            sent=True,\n            accepted=False,\n            rejection=t(\"model.schema\", lang),\n        )\n    updated, rejected_ids = apply_model_wording(explanations, parsed, lang=lang)\n    note = None\n    if rejected_ids:\n        note = t(\"model.unfaithful\", lang, ids=\", \".join(rejected_ids))\n    return updated, ModelCall(payload=payload, sent=True, accepted=True, rejection=note, body={\"stops\": parsed})\n\n\ndef apply_member_feedback(\n    member: Member,\n    venue: Venue,\n    signal: float,\n    personalisation_consent: bool,\n    lang: str = \"en\",\n) -> tuple[Member, str]:\n    \"\"\"Update one member when they consented. Other members are simply not passed in.\"\"\"\n    if not personalisation_consent:\n        return member, t(\"feedback.off\", lang)\n    preferences, count = moving_average_update(member, venue, signal)\n    if count == member.update_count:\n        return member, t(\"feedback.neutral\", lang)\n    updated = replace(member, preferences=preferences, update_count=count)\n    return updated, t(\"feedback.updated\", lang)\n",
 "triper/preferences.py": "\"\"\"Per-member preference updates.\n\nAccepts, rejects, and ratings adjust only that member's preference vector\nby a simple moving average of one observation. This is not reinforcement\nlearning: there is no reward model, policy, or shared update.\n\nsignal > 0 pulls the vector toward the venue's tags.\nsignal < 0 damps the tags of the rejected venue and leaves unrelated\ninterests alone. signal 0 makes no change.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom triper.models import INTERESTS, Member, Venue\n\n# Prior observations so the first click does not replace the stated profile.\nPRIOR_STRENGTH = 3\n\n\ndef rating_to_signal(rating: int) -> float:\n    \"\"\"Map a 1–5 rating onto [-1, 1]. A rating of 3 is neutral.\"\"\"\n    bounded = min(5, max(1, int(rating)))\n    return (bounded - 3) / 2.0\n\n\ndef observation(member: Member, venue: Venue, signal: float) -> dict[str, float]:\n    signal = max(-1.0, min(1.0, signal))\n    observed: dict[str, float] = {}\n    for key in INTERESTS:\n        current = float(member.preferences.get(key, 0.0))\n        tag = float(venue.tags.get(key, 0.0))\n        if signal > 0:\n            observed[key] = (1.0 - signal) * current + signal * tag\n        elif signal < 0:\n            strength = -signal\n            observed[key] = min(1.0, max(0.0, current * (1.0 - strength * tag)))\n        else:\n            observed[key] = current\n    return observed\n\n\ndef moving_average_update(\n    member: Member,\n    venue: Venue,\n    signal: float,\n) -> tuple[dict[str, float], int]:\n    \"\"\"Return the updated preference vector and the new observation count.\n\n    Does not mutate the member. Callers apply the result only when\n    personalisation consent is on, and only to the member who gave feedback.\n    \"\"\"\n    signal = max(-1.0, min(1.0, signal))\n    if signal == 0.0:\n        return {key: float(member.preferences.get(key, 0.0)) for key in INTERESTS}, member.update_count\n    observed = observation(member, venue, signal)\n    count = PRIOR_STRENGTH + member.update_count\n    updated = {\n        key: (count * float(member.preferences.get(key, 0.0)) + observed[key]) / (count + 1.0)\n        for key in INTERESTS\n    }\n    return updated, member.update_count + 1\n",
 "triper/routing.py": "\"\"\"Orienteering heuristic with time windows and must-visit anchors.\n\nSelect and order activities inside each day's time, then maximise weighted\nNash social welfare subject to the fairness floor. FIXED must-visits with a\nclock time stay locked. Other must-visits must appear somewhere in the trip.\nSearch is greedy insertion followed by bounded local search, with a penalty\non unequal day lengths. This is not an exact optimum.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, replace\nfrom datetime import date\n\nfrom triper.fairness import PlanUtility, plan_is_better\nfrom triper.geo import estimate_leg\nfrom triper.models import Member, MustVisit, TripInput, Venue, format_hm, parse_hm, weekday_key\nfrom triper.money import planning_budget_sgd\nfrom triper.scoring import normalise_satisfaction, score_member_venue\n\n# Local-search breadth is capped so a re-plan stays interactive.\nMAX_LOCAL_ITERS = 8\nMAX_OPTIONAL_PER_DAY = 3\nREPLACEMENT_POOL = 6\n# Hours-squared. Large enough to prefer a spare day when two insertions\n# have a similar prize, and small enough that a useful stop is still added.\nDAY_LENGTH_LAMBDA = 0.6\n\nHEURISTIC_NOTE = (\n    \"Routing is a heuristic for the team orienteering problem with time windows: \"\n    \"greedy insertion, then bounded local search (relocate, swap, 2-opt, removal, \"\n    \"and replacements from the unused venues with the highest mean preference match). \"\n    \"The prize is the total member-weighted score collected in the time window, \"\n    \"subject to the fairness floor on averaged satisfaction U_k. Maximising the \"\n    \"product of those averages on its own would collapse to a very short plan, \"\n    \"so weighted NSW is the floor and the tie-break, not the insertion prize. \"\n    \"A penalty on unequal day lengths discourages stacking one day, and a back-to-back \"\n    \"same-category penalty keeps the heuristic from scheduling two meals in a row when \"\n    \"another category still fits. Venues with unknown hours or price stay eligible \"\n    \"and are flagged, but the heuristic subtracts a caution from their prize so a \"\n    \"missing value is not treated as a perfect score. \"\n    \"This is not an exact optimum. FIXED must-visits that carry a time stay locked; \"\n    \"FLEXIBLE must-visits must appear somewhere in the trip and may move.\"\n)\n\n\n@dataclass\nclass Node:\n    venue_id: str\n    role: str  # anchor_timed, anchor_must, optional\n    fixed_start: int | None = None\n    fixed_date: str | None = None\n\n\n@dataclass\nclass ScheduledStop:\n    venue_id: str\n    role: str\n    arrive_min: int\n    depart_min: int\n    dwell_min: int\n    travel_min: int\n    travel_cost: float\n    travel_mode: str\n    uncertain_hours: bool\n    uncertain_price: bool\n\n\n@dataclass\nclass ScheduledDay:\n    day: str\n    stops: list[ScheduledStop]\n    return_travel_min: int\n    return_cost: float\n    return_mode: str\n    start_min: int\n    end_min: int\n    activity_min: int\n    known_cost: float\n\n\n@dataclass\nclass Evaluation:\n    plan: PlanUtility\n    days: list[ScheduledDay]\n    scores: dict[str, list[float]]\n    total_known_cost: float\n\n\n@dataclass\nclass RouteResult:\n    days: list[ScheduledDay]\n    utilities: list[float]\n    weights: list[float]\n    plan: PlanUtility\n    scores: dict[str, list[float]]\n    conflicts: list[str]\n    total_known_cost: float\n    note: str = HEURISTIC_NOTE\n\n\ndef pace_multiplier(members: list[Member]) -> float:\n    \"\"\"The slowest stated pace sets dwell time, so the plan stays feasible for them.\"\"\"\n    table = {\"slow\": 1.25, \"moderate\": 1.0, \"fast\": 0.8}\n    if not members:\n        return 1.0\n    return max(table.get(member.pace, 1.0) for member in members)\n\n\ndef dwell_minutes(venue: Venue, members: list[Member]) -> int:\n    return max(20, int(round(venue.duration_min * pace_multiplier(members))))\n\n\ndef _clone(days: dict[str, list[Node]]) -> dict[str, list[Node]]:\n    return {day: [replace(node) for node in nodes] for day, nodes in days.items()}\n\n\ndef _ids(days: dict[str, list[Node]]) -> set[str]:\n    return {node.venue_id for nodes in days.values() for node in nodes}\n\n\ndef _delay_minutes(trip: TripInput, day_iso: str, first_iso: str) -> int:\n    if not trip.delay_minutes:\n        return 0\n    if trip.delay_date is None:\n        return int(trip.delay_minutes) if day_iso == first_iso else 0\n    return int(trip.delay_minutes) if trip.delay_date == day_iso else 0\n\n\ndef _bounds(trip: TripInput, day_iso: str, first_iso: str) -> tuple[int, int] | None:\n    start = parse_hm(trip.day_start) + _delay_minutes(trip, day_iso, first_iso)\n    end = parse_hm(trip.day_end)\n    if start >= end:\n        return None\n    return start, end\n\n\ndef _place(\n    venue: Venue,\n    day_iso: str,\n    arrive_guess: int,\n    dwell: int,\n    day_end: int,\n    fixed_start: int | None,\n) -> tuple[int, int, bool] | None:\n    if fixed_start is not None and arrive_guess > fixed_start:\n        return None\n    uncertain = not venue.hours_known or venue.hours is None\n    if uncertain:\n        arrive = fixed_start if fixed_start is not None else arrive_guess\n        depart = arrive + dwell\n        if depart > day_end:\n            return None\n        return arrive, depart, True\n    span = venue.hours.get(weekday_key(date.fromisoformat(day_iso))) if venue.hours else None\n    if span is None:\n        return None\n    open_min, close_min = span\n    if fixed_start is not None:\n        depart = fixed_start + dwell\n        if fixed_start < open_min or depart > close_min or depart > day_end:\n            return None\n        return fixed_start, depart, False\n    arrive = max(arrive_guess, open_min)\n    depart = arrive + dwell\n    if depart > close_min or depart > day_end:\n        return None\n    return arrive, depart, False\n\n\ndef simulate(\n    days: dict[str, list[Node]],\n    trip: TripInput,\n    venues: dict[str, Venue],\n    members: list[Member],\n) -> Evaluation | None:\n    party = max(1, len(members))\n    ordered_days = list(days)\n    if not ordered_days:\n        return None\n    seen: set[str] = set()\n    for nodes in days.values():\n        for node in nodes:\n            if node.venue_id in seen:\n                return None\n            seen.add(node.venue_id)\n    first = ordered_days[0]\n    total_cost = 0.0\n    scheduled: list[ScheduledDay] = []\n    scores: dict[str, list[float]] = {member.id: [] for member in members}\n    collected = 0.0\n    budget_sgd = planning_budget_sgd(trip)\n    modes = trip.transport_modes or [\"walk\"]\n    for day_iso in ordered_days:\n        bounds = _bounds(trip, day_iso, first)\n        if bounds is None:\n            return None\n        start_min, end_min = bounds\n        clock = start_min\n        lat, lon = trip.abode_lat, trip.abode_lon\n        day_stops: list[ScheduledStop] = []\n        day_cost = 0.0\n        activity = 0\n        for node in days[day_iso]:\n            if node.fixed_date and node.fixed_date != day_iso:\n                return None\n            venue = venues.get(node.venue_id)\n            if venue is None:\n                return None\n            remaining = budget_sgd - total_cost - day_cost\n            leg = estimate_leg(lat, lon, venue.lat, venue.lon, modes, party, remaining_budget=remaining)\n            if leg is None:\n                return None\n            dwell = dwell_minutes(venue, members)\n            placed = _place(venue, day_iso, clock + leg.minutes, dwell, end_min, node.fixed_start)\n            if placed is None:\n                return None\n            arrive, depart, uncertain_hours = placed\n            activity_cost = 0.0 if venue.price_per_person_sgd is None else venue.price_per_person_sgd * party\n            if leg.cost_sgd + activity_cost > remaining + 1e-6:\n                return None\n            for member in members:\n                score, _, _ = score_member_venue(member, venue, trip.alphas, leg.minutes)\n                scores[member.id].append(score)\n                collected += float(member.weight) * score\n            weight_sum = sum(float(member.weight) for member in members)\n            if day_stops and venues[day_stops[-1].venue_id].category == venue.category:\n                # Heuristic variety term so two stops of one category are not\n                # glued together when a different category still fits.\n                collected -= 0.45 * weight_sum\n            if not venue.hours_known or venue.price_per_person_sgd is None:\n                # Unknown hours or price stay eligible, but they do not get a\n                # free ride in the prize. The score itself is not imputed.\n                collected -= 0.35 * weight_sum\n            day_cost += leg.cost_sgd + activity_cost\n            activity += dwell\n            day_stops.append(\n                ScheduledStop(\n                    venue_id=venue.id,\n                    role=node.role,\n                    arrive_min=arrive,\n                    depart_min=depart,\n                    dwell_min=dwell,\n                    travel_min=leg.minutes,\n                    travel_cost=leg.cost_sgd,\n                    travel_mode=leg.mode,\n                    uncertain_hours=uncertain_hours,\n                    uncertain_price=venue.price_per_person_sgd is None,\n                )\n            )\n            clock = depart\n            lat, lon = venue.lat, venue.lon\n        remaining = budget_sgd - total_cost - day_cost\n        back = estimate_leg(lat, lon, trip.abode_lat, trip.abode_lon, modes, party, remaining_budget=remaining)\n        if back is None or clock + back.minutes > end_min:\n            return None\n        if back.cost_sgd - remaining > 1e-6:\n            return None\n        day_cost += back.cost_sgd\n        total_cost += day_cost\n        scheduled.append(\n            ScheduledDay(\n                day=day_iso,\n                stops=day_stops,\n                return_travel_min=back.minutes,\n                return_cost=back.cost_sgd,\n                return_mode=back.mode,\n                start_min=start_min,\n                end_min=end_min,\n                activity_min=activity,\n                known_cost=round(day_cost, 2),\n            )\n        )\n    utilities = [normalise_satisfaction(scores[member.id]) for member in members]\n    weights = [float(member.weight) for member in members]\n    penalty = _day_penalty(scheduled)\n    plan = PlanUtility(\n        utilities=utilities,\n        weights=weights,\n        beta=trip.beta,\n        day_length_penalty=penalty,\n        collected=collected,\n    )\n    return Evaluation(plan=plan, days=scheduled, scores=scores, total_known_cost=round(total_cost, 2))\n\n\ndef _day_penalty(days: list[ScheduledDay]) -> float:\n    if len(days) < 2:\n        return 0.0\n    hours = [day.activity_min / 60.0 for day in days]\n    mean = sum(hours) / len(hours)\n    variance = sum((hour - mean) ** 2 for hour in hours) / len(hours)\n    return DAY_LENGTH_LAMBDA * variance\n\n\ndef _better_eval(candidate: Evaluation | None, incumbent: Evaluation | None) -> bool:\n    if candidate is None:\n        return False\n    if incumbent is None:\n        return True\n    return plan_is_better(candidate.plan, incumbent.plan)\n\n\ndef _insert(days: dict[str, list[Node]], day: str, index: int, node: Node) -> dict[str, list[Node]]:\n    trial = _clone(days)\n    trial[day].insert(index, node)\n    return trial\n\n\ndef _best_insertion(\n    days: dict[str, list[Node]],\n    node: Node,\n    trip: TripInput,\n    venues: dict[str, Venue],\n    members: list[Member],\n    allowed_days: list[str] | None,\n    optional_cap: bool,\n) -> tuple[dict[str, list[Node]], Evaluation] | None:\n    best_days: dict[str, list[Node]] | None = None\n    best_eval: Evaluation | None = None\n    day_list = allowed_days or list(days)\n    for day in day_list:\n        if day not in days:\n            continue\n        if optional_cap and node.role == \"optional\":\n            optional = sum(1 for item in days[day] if item.role == \"optional\")\n            if optional >= MAX_OPTIONAL_PER_DAY:\n                continue\n        for index in range(len(days[day]) + 1):\n            trial = _insert(days, day, index, node)\n            evaluation = simulate(trial, trip, venues, members)\n            if _better_eval(evaluation, best_eval):\n                best_days, best_eval = trial, evaluation\n    if best_days is None or best_eval is None:\n        return None\n    return best_days, best_eval\n\n\ndef _optional_count(days: dict[str, list[Node]], day: str) -> int:\n    return sum(1 for node in days[day] if node.role == \"optional\")\n\n\ndef _local_search(\n    days: dict[str, list[Node]],\n    trip: TripInput,\n    venues: dict[str, Venue],\n    members: list[Member],\n    pool: list[Venue],\n) -> dict[str, list[Node]]:\n    current = days\n    for _ in range(MAX_LOCAL_ITERS):\n        incumbent = simulate(current, trip, venues, members)\n        best_days = None\n        best_eval = incumbent\n        day_names = list(current)\n        for day in day_names:\n            for index, node in enumerate(current[day]):\n                if node.role != \"optional\":\n                    continue\n                trial = _clone(current)\n                trial[day].pop(index)\n                evaluation = simulate(trial, trip, venues, members)\n                if _better_eval(evaluation, best_eval):\n                    best_days, best_eval = trial, evaluation\n        for src_day in day_names:\n            for index, node in enumerate(current[src_day]):\n                if node.role == \"anchor_timed\":\n                    continue\n                for dst_day in day_names:\n                    if node.role == \"optional\" and src_day != dst_day:\n                        if _optional_count(current, dst_day) >= MAX_OPTIONAL_PER_DAY:\n                            continue\n                    limit = len(current[dst_day]) + 1\n                    for dst_index in range(limit):\n                        if src_day == dst_day and dst_index in (index, index + 1):\n                            continue\n                        trial = _clone(current)\n                        moved = trial[src_day].pop(index)\n                        insert_at = dst_index\n                        if src_day == dst_day and insert_at > index:\n                            insert_at -= 1\n                        insert_at = max(0, min(insert_at, len(trial[dst_day])))\n                        trial[dst_day].insert(insert_at, moved)\n                        evaluation = simulate(trial, trip, venues, members)\n                        if _better_eval(evaluation, best_eval):\n                            best_days, best_eval = trial, evaluation\n        pairs: list[tuple[str, int]] = []\n        for day in day_names:\n            for index, node in enumerate(current[day]):\n                if node.role != \"anchor_timed\":\n                    pairs.append((day, index))\n        for left in range(len(pairs)):\n            for right in range(left + 1, len(pairs)):\n                day_a, index_a = pairs[left]\n                day_b, index_b = pairs[right]\n                trial = _clone(current)\n                trial[day_a][index_a], trial[day_b][index_b] = trial[day_b][index_b], trial[day_a][index_a]\n                evaluation = simulate(trial, trip, venues, members)\n                if _better_eval(evaluation, best_eval):\n                    best_days, best_eval = trial, evaluation\n        for day in day_names:\n            sequence = current[day]\n            for start in range(len(sequence)):\n                for end in range(start + 2, len(sequence) + 1):\n                    if any(node.role == \"anchor_timed\" for node in sequence[start:end]):\n                        continue\n                    trial = _clone(current)\n                    trial[day][start:end] = list(reversed(trial[day][start:end]))\n                    evaluation = simulate(trial, trip, venues, members)\n                    if _better_eval(evaluation, best_eval):\n                        best_days, best_eval = trial, evaluation\n        used = _ids(current)\n        for venue in pool:\n            if venue.id in used:\n                continue\n            for day in day_names:\n                for index, node in enumerate(current[day]):\n                    if node.role != \"optional\":\n                        continue\n                    trial = _clone(current)\n                    trial[day][index] = Node(venue.id, \"optional\")\n                    evaluation = simulate(trial, trip, venues, members)\n                    if _better_eval(evaluation, best_eval):\n                        best_days, best_eval = trial, evaluation\n        if best_days is None:\n            break\n        current = best_days\n    return current\n\n\ndef _mean_preference(venue: Venue, members: list[Member]) -> float:\n    from triper.scoring import preference_match\n\n    if not members:\n        return 0.0\n    return sum(preference_match(member, venue) for member in members) / len(members)\n\n\ndef optimise(\n    trip: TripInput,\n    kept: list[Venue],\n    catalogue: dict[str, Venue],\n    dropped_details: dict[str, str],\n) -> RouteResult:\n    \"\"\"Build one itinerary. `dropped_details` maps a blocked must-visit id to a group-level reason.\"\"\"\n    venues = {venue.id: venue for venue in kept}\n    members = trip.members\n    days: dict[str, list[Node]] = {day.isoformat(): [] for day in trip.dates()}\n    conflicts: list[str] = []\n    if not days:\n        raise ValueError(\"The trip has no dates.\")\n    if not members:\n        raise ValueError(\"Add at least one traveller before optimising.\")\n\n    placed: set[str] = set()\n    timed: list[MustVisit] = []\n    dated: list[MustVisit] = []\n    flexible: list[MustVisit] = []\n    for must in trip.must_visits:\n        if must.venue_id in placed:\n            continue\n        placed.add(must.venue_id)\n        kind = must.kind.upper()\n        if kind == \"FIXED\" and must.at_time:\n            timed.append(must)\n        elif kind == \"FIXED\" and must.on_date:\n            dated.append(must)\n        else:\n            flexible.append(must)\n\n    def place_must(must: MustVisit, node: Node, allowed: list[str] | None) -> None:\n        if must.venue_id not in venues:\n            name = catalogue[must.venue_id].name if must.venue_id in catalogue else must.venue_id\n            reason = dropped_details.get(must.venue_id, \"it is not available in the filtered catalogue\")\n            conflicts.append(\n                f\"{name} is a {must.kind.upper()} must-visit but was not scheduled: {reason}. \"\n                \"Criterion weights cannot override that.\"\n            )\n            return\n        found = _best_insertion(days, node, trip, venues, members, allowed, optional_cap=False)\n        if found is None:\n            name = venues[must.venue_id].name\n            when = \"\"\n            if must.on_date or must.at_time:\n                when = f\" (requested {must.on_date or 'any day'} {must.at_time or ''})\".rstrip()\n            conflicts.append(\n                f\"{name} is a {must.kind.upper()} must-visit{when} but no feasible slot fits \"\n                f\"the time window, opening hours, travel, and budget. \"\n                f\"The search did not drop a hard constraint to force it in.\"\n            )\n            return\n        updated, _ = found\n        days.clear()\n        days.update(updated)\n\n    for must in sorted(timed, key=lambda item: (item.on_date or \"\", item.at_time or \"\")):\n        allowed = [must.on_date] if must.on_date else None\n        node = Node(must.venue_id, \"anchor_timed\", parse_hm(must.at_time or \"00:00\"), must.on_date)\n        place_must(must, node,
